<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/kit/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <style>
      :root { --bg: #0b0a07; --y: #ffd400; --y2: #ffe76a; --red: #e3051b; --ink: #f7f3e6; --muted: #8f897a; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #1d1a0c 0, #0b0a07 60%); font-family: "Rubik", "Assistant", sans-serif; color: var(--ink); direction: rtl; }
      .sc { position: absolute; inset: 0; overflow: hidden; }
      .glow { filter: drop-shadow(0 0 10px rgba(255, 212, 0, 0.9)) drop-shadow(0 0 30px rgba(255, 212, 0, 0.5)); }
      #trail { position: absolute; inset: 0; z-index: 4; overflow: visible; }

      /* intro road */
      #lanes { position: absolute; left: 520px; top: -200px; width: 40px; height: 2400px; }
      .lane { position: absolute; left: 0; width: 40px; height: 150px; border-radius: 8px; background: var(--y); }
      .kt { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; color: var(--ink); line-height: 1.02; letter-spacing: -1px; }
      .kt em { font-style: normal; color: var(--y); }
      #t0 { top: 820px; font-size: 130px; z-index: 5; text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8); }

      /* phone */
      #phone { position: absolute; left: 250px; top: 420px; width: 580px; height: 1147px; border-radius: 78px; background: #050505; box-shadow: 0 0 0 3px #2b2a26, 0 60px 140px rgba(0, 0, 0, 0.7); z-index: 3; transform-origin: 50% 50%; }
      #scr { position: absolute; left: 20px; top: 20px; width: 540px; height: 1107px; border-radius: 60px; overflow: hidden; background: #fff; }
      #scr img, #scr video { position: absolute; left: 0; top: 0; width: 540px; height: 1107px; object-fit: cover; }
      #isl { position: absolute; left: 215px; top: 36px; width: 150px; height: 42px; border-radius: 21px; background: #000; z-index: 9; }
      #card { position: absolute; left: 62px; top: 208px; width: 416px; height: 190px; border-radius: 12px; background: #fff; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08); display: flex; flex-direction: column; align-items: center; padding-top: 12px; box-sizing: border-box; font-family: "Assistant", sans-serif; color: #444; }
      #card small { font-size: 19px; }
      #card svg { width: 240px; height: 72px; margin-top: 8px; }
      #card b { font-weight: 500; font-size: 24px; color: #333; direction: ltr; margin-top: 4px; letter-spacing: 1px; }
      #pocket { top: 280px !important; height: 260px !important; object-fit: fill !important; }
      .tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; background: rgba(255, 212, 0, 0.45); border: 4px solid var(--y); z-index: 8; }
      #paid { position: absolute; left: 110px; top: 470px; width: 320px; height: 120px; border-radius: 30px; background: rgba(0, 0, 0, 0.82); color: #fff; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 40px; font-weight: 800; z-index: 8; }
      #paid i { width: 54px; height: 54px; border-radius: 50%; background: #2fd06e; display: flex; align-items: center; justify-content: center; }
      #paid svg { width: 34px; height: 34px; }

      /* headlines above the phone */
      .hl { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font-size: 96px; font-weight: 900; line-height: 1.05; letter-spacing: -1px; }
      .hl em { font-style: normal; color: var(--y); }
      .sub { position: absolute; left: 0; right: 0; top: 1710px; text-align: center; font-size: 56px; font-weight: 800; color: var(--ink); }
      .sub em { font-style: normal; color: var(--y); }

      /* five errands */
      .bd { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; box-shadow: 0 0 30px currentColor; z-index: 5; }
      #big50 { position: absolute; left: 0; right: 0; top: 120px; text-align: center; font-size: 230px; font-weight: 900; color: var(--y); direction: ltr; line-height: 1; text-shadow: 0 0 60px rgba(255, 212, 0, 0.6); z-index: 6; }
      #plane { position: absolute; left: 0; top: 0; width: 90px; height: 90px; margin: -45px 0 0 -45px; z-index: 6; }

      /* logo + credits */
      #logov { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #cred { position: absolute; left: 0; right: 0; top: 860px; text-align: center; direction: ltr; font-family: "Assistant", sans-serif; }
      #cred small { display: block; font-size: 34px; letter-spacing: 6px; color: var(--muted); text-transform: uppercase; }
      #cred b { display: block; font-size: 84px; font-weight: 700; color: var(--ink); margin-top: 10px; letter-spacing: 1px; }
      #cred i { display: block; width: 260px; height: 4px; margin: 26px auto 0; background: var(--y); box-shadow: 0 0 20px rgba(255, 212, 0, 0.8); }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      const $ = (s) => document.querySelector(s);
      const ft = (sel, from, to, at) => { tl.set(sel, from, 0); tl.fromTo(sel, from, { ...to, ...IR }, at); };
      const show = (sel, a, b) => { tl.set(sel, { opacity: 0 }, 0); tl.set(sel, { opacity: 1 }, a); if (b != null) tl.set(sel, { opacity: 0 }, b); };
      const headline = (sel, a, b) => {
        ft(sel, { opacity: 0, y: 50, scale: 1.08, filter: "blur(12px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "expo.out" }, a);
        tl.to(sel, { opacity: 0, y: -30, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, b - 0.18);
      };
      const draw = (sel, a, d, ease = "power2.inOut") => { const p = $(sel), L = p.getTotalLength(); ft(sel, { strokeDasharray: L + " " + L, strokeDashoffset: L, opacity: 1 }, { strokeDashoffset: 0, duration: d, ease }, a); };

      // ---- intro: lane markers rush past, the line takes off ----
      const lanes = $("#lanes");
      for (let i = 0; i < 9; i++) { const d = document.createElement("div"); d.className = "lane"; d.style.top = i * 280 + "px"; lanes.appendChild(d); }
      tl.fromTo("#lanes", { y: -560 }, { y: 280, duration: 1.9, ease: "power1.in", ...IR }, 0);
      tl.set("#lanes", { y: -560 }, 0);
      ft("#t0", { opacity: 0, scale: 1.3, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, 0.55);
      tl.to("#t0", { opacity: 0, scale: 0.9, duration: 0.2 }, 1.7);

      // ---- phone outline drawn by the trail, then the phone appears ----
      draw("#pOutline", 1.6, 0.55, "power2.inOut");
      tl.to("#pOutline", { opacity: 0, duration: 0.3 }, 2.4);
      ft("#phone", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 2.0);
      tl.fromTo("#phone", { rotationY: -14, rotationX: 4 }, { rotationY: 10, rotationX: 0, duration: 13, ease: "sine.inOut", ...IR }, 2.0);
      tl.set("#phone", { rotationY: -14, rotationX: 4 }, 0);
      headline("#h1", 1.86, 3.6);

      // screens inside the phone
      show("#sStations", 3.62, 4.64);
      ft("#sStations", { y: 60 }, { y: 0, duration: 0.35, ease: "expo.out" }, 3.62);
      ft("#tap1", { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1, opacity: 1, duration: 0.12 }, { scale: 1.5, opacity: 0, duration: 0.35 }] }, 4.1);
      headline("#h2", 3.62, 4.64);
      show("#sFuel2", 4.64, 6.26);
      ft("#sFuel2", { scale: 1.06 }, { scale: 1, duration: 0.5, ease: "expo.out" }, 4.64);
      ft("#tap2", { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1, opacity: 1, duration: 0.12 }, { scale: 1.6, opacity: 0, duration: 0.4 }] }, 5.35);
      ft("#paid", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)" }, 5.7);
      tl.set("#paid", { opacity: 0 }, 6.26);
      headline("#h3", 4.64, 6.26);

      // home: the personal code card slides out of the pocket (generic code, not the real one)
      let bars = "", x = 2;
      for (let i = 0; i < 40 && x < 118; i++) { const w = 1 + ((i * 7) % 3); bars += '<rect x="' + x + '" y="0" width="' + w + '" height="36" fill="#111"/>'; x += w + 1 + ((i * 5) % 2); }
      $("#bars").innerHTML = bars;
      show(["#sHome", "#card", "#pocket"], 6.26, 8.5);
      ft("#card", { y: 0 }, { y: -156, duration: 0.55, ease: "back.out(1.4)" }, 7.1);
      headline("#h4", 6.26, 8.5);

      // coupons / five errands / El Al (real app recordings)
      headline("#h5", 8.56, 9.82);
      // five branches light up one after another
      ["#pB1", "#pB2", "#pB3", "#pB4", "#pB5"].forEach((p, i) => { draw(p, 9.85 + i * 0.2, 0.35, "power2.out"); tl.to(p, { opacity: 0, duration: 0.3 }, 12.3); });
      ["#bd1", "#bd2", "#bd3", "#bd4", "#bd5"].forEach((b, i) => { ft(b, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, 10.05 + i * 0.2); tl.to(b, { scale: 0, opacity: 0, duration: 0.25 }, 11.0); });
      ft("#big50", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.2)" }, 11.12);
      tl.to("#big50", { opacity: 0, y: -40, duration: 0.2 }, 12.3);
      ft("#s50", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 10.32);
      tl.to("#s50", { opacity: 0, duration: 0.2 }, 12.3);
      tl.set("#phone", { y: 0 }, 0);
      tl.to("#phone", { y: 90, duration: 0.5, ease: "power2.inOut" }, 10.9);
      tl.to("#phone", { y: 0, duration: 0.5, ease: "power2.inOut" }, 12.2);

      headline("#h7", 12.48, 15.0);
      draw("#pFlight", 12.6, 1.9, "power1.inOut");
      tl.to("#pFlight", { opacity: 0, duration: 0.3 }, 14.7);
      // plane rides the flight path
      const fp = $("#pFlight"), FL = fp.getTotalLength(), kf = [];
      for (let i = 0; i <= 24; i++) {
        const a = fp.getPointAtLength((FL * i) / 24), b = fp.getPointAtLength(Math.min(FL, (FL * (i + 0.5)) / 24));
        kf.push({ x: a.x, y: a.y, rotation: (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI + 90, duration: 1.9 / 24 });
      }
      tl.set("#plane", { x: kf[0].x, y: kf[0].y, opacity: 0 }, 0);
      tl.set("#plane", { opacity: 1 }, 12.6);
      tl.to("#plane", { keyframes: kf.slice(1), ease: "none" }, 12.6);
      tl.to("#plane", { opacity: 0, duration: 0.2 }, 14.6);

      // dive into the screen, cut to the real app intro (logo)
      tl.to("#phone", { scale: 2.3, opacity: 0, duration: 0.4, ease: "power3.in" }, 14.65);
      ft("#logov", { scale: 1.12 }, { scale: 1, duration: 1.8, ease: "expo.out" }, 15.0);

      // credits
      ft("#cred small", { opacity: 0, scaleX: 1.4 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "expo.out" }, 16.9);
      ft("#cred b", { opacity: 0, y: 30, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 17.1);
      ft("#credl", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 17.35);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
