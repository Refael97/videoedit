      <audio id="sxP" src="assets/whoosh.wav" data-start="15.3" data-duration="0.7" data-track-index="19" data-volume="0.55"></audio>
      <div id="intro" class="clip" data-start="0" data-duration="1" data-track-index="4"><div class="hal"></div><img id="ilogo" class="aa" src="assets/crops2/yellow_logo.png" /></div>
    </div>

    <script>
      const tl = gsap.timeline();
      const IR = { immediateRender: false };
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const ft = (sel, from, to, at) => { tl.set(sel, from, 0); tl.fromTo(sel, from, { ...to, ...IR }, at); };
      const N = 7, PW = 1920;
      const X = (p, x) => (N - 1 - p) * PW + x; // panel-local x -> world x (panels run right-to-left)
      $$(".pn").forEach((el, i) => { el.style.left = X(i, 0) + "px"; });
      let seed = 5;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      // ---------- camera ----------
      const camAt = (p) => -X(p, 0);
      tl.set("#world", { x: camAt(0) }, 0);
      [[1, 1.6], [2, 6.0], [3, 8.28], [4, 9.58], [5, 12.22]].forEach(([b, t]) => tl.to("#world", { x: camAt(b), duration: 0.5, ease: "power3.inOut" }, t));
      [[0, 1.6], [1.6, 6.0], [6.0, 8.28], [8.28, 9.58], [9.58, 12.22], [12.22, 15.4]].forEach(([a, b]) => tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.03, duration: b - a, ease: "none", ...IR }, a));
      tl.set("#cam", { scale: 1 }, 0);

      // ---------- neon trail: one continuous line, curves only; every spark fades where its piece stops ----------
      const NS = "http://www.w3.org/2000/svg";
      const P = (p, pts) => pts.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (m, x, y) => X(p, +x) + "," + y);
      const piece = (d, a, b, o = {}) => {
        const mk = (g, cls) => { const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); q.setAttribute("class", cls); $(g).appendChild(q); return q; };
        const ps = [mk("#gHalo", "sH"), mk("#gTube", "sT"), mk("#gCore", "sC")], p = ps[1], L = p.getTotalLength(), dur = b - a, ease = o.ease || "sine.inOut";
        ft(ps, { strokeDasharray: L + " " + L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease }, a);
        if (!o.noHead) {
          const h = document.createElement("div"); h.className = "head"; h.innerHTML = "<b></b><i></i>"; $("#world").appendChild(h);
          const e = gsap.parseEase(ease), n = Math.max(8, Math.round(dur * 30)), kf = [];
          for (let i = 1; i <= n; i++) { const pt = p.getPointAtLength(L * e(i / n)), q = p.getPointAtLength(Math.min(L, L * e(i / n) + 3)); kf.push({ x: pt.x, y: pt.y, rotation: (Math.atan2(q.y - pt.y, q.x - pt.x) * 180) / Math.PI, duration: dur / n }); }
          const p0 = p.getPointAtLength(0);
          tl.set(h, { x: p0.x, y: p0.y, opacity: 0, scale: 1 }, 0);
          tl.set(h, { opacity: 1 }, a);
          tl.to(h, { keyframes: kf, ease: "none" }, a);
          // hand-off to the next piece at the same point, or die out at the connection point
          if (o.chain) tl.set(h, { opacity: 0 }, b);
          else tl.to(h, { opacity: 0, scale: 0.3, duration: 0.25, ease: "power2.in" }, b);
        }
        return p;
      };
      // a neon selection frame drawn around a card (above it), instead of a branch line
      const neonFrame = (pn, x, y, w, h, r, a, out) => {
        const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "nf"); svg.setAttribute("viewBox", "0 0 1920 1080"); $(pn).appendChild(svg);
        const cx = x + w / 2, d = "M" + cx + "," + (y + h) + " L" + (x + r) + "," + (y + h) + " Q" + x + "," + (y + h) + " " + x + "," + (y + h - r) + " L" + x + "," + (y + r) + " Q" + x + "," + y + " " + (x + r) + "," + y + " L" + (x + w - r) + "," + y + " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + " L" + (x + w) + "," + (y + h - r) + " Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) + " Z";
        [["rgba(255,179,0,0.6)", 16, "blur(9px)"], ["#ffd400", 5, "drop-shadow(0 0 5px #ffd400) drop-shadow(0 0 14px rgba(255,190,0,0.8))"], ["#fffbe8", 1.8, "none"]].forEach(([c, w2, f]) => {
          const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); q.setAttribute("fill", "none"); q.setAttribute("stroke", c); q.setAttribute("stroke-width", w2); q.setAttribute("stroke-linecap", "round"); q.style.filter = f; svg.appendChild(q);
          const L = q.getTotalLength();
          ft(q, { strokeDasharray: L + " " + L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, a);
        });
        tl.set(svg, { opacity: 1 }, 0);
        tl.to(svg, { opacity: 0, duration: 0.2 }, out);
      };
      // full rounded loop around a phone, starting and closing on its right edge
      const LOOP = "M814,790 L814,236 Q814,176 754,176 L516,176 Q456,176 456,236 L456,804 Q456,864 516,864 L754,864 Q814,864 814,804 L814,790";
      // P0 -> P1: travels low under the hook, rises into the phone and closes a full loop around it
      piece(P(0, "M1990,1035 C1500,1040 1250,1000 960,1005 S300,1035 0,1035"), 0.15, 1.65, { ease: "sine.inOut", chain: true });
      piece(P(1, "M1920,1035 C1300,1040 814,1000 814,790"), 1.65, 2.05, { ease: "sine.in", chain: true });
      piece(P(1, LOOP), 2.05, 2.9, { ease: "none" });
      neonFrame("#P1", 1170, 660, 580, 125, 28, 3.95, 4.46);
      neonFrame("#P1", 1210, 630, 540, 132, 66, 5.12, 5.95);
      // leaves from the bottom of the iPhone to the next screen
      piece(P(1, "M635,864 C540,864 520,1035 380,1035 L0,1035"), 5.8, 6.3, { ease: "sine.in", chain: true });
      // P2: under the wallet, a rounded turn up its side, out at mid height
      piece(P(2, "M1920,1035 C1400,1035 1200,950 1000,950 L420,950 Q330,950 330,860 L330,700 C330,620 250,600 0,600"), 6.3, 8.3, { ease: "sine.inOut", chain: true });
      // P3: into the middle of the punch card's right side, splits over and under it, meets on the far side, leaves as one
      piece(P(3, "M1920,600 C1300,610 1120,365 1060,365"), 8.3, 8.72, { ease: "sine.out", chain: true });
      piece(P(3, "M1060,365 Q1000,365 1000,305 L1000,240 Q1000,180 940,180 L420,180 Q360,180 360,240 L360,305 Q360,365 300,365"), 8.72, 9.25, { ease: "sine.inOut", chain: true });
      piece(P(3, "M1060,365 Q1000,365 1000,425 L1000,490 Q1000,550 940,550 L420,550 Q360,550 360,490 L360,425 Q360,365 300,365"), 8.72, 9.25, { ease: "sine.inOut", chain: true });
      piece(P(3, "M300,365 C190,365 170,1000 0,1000"), 9.25, 9.62, { ease: "sine.in", chain: true });
      // P4: in to the gift, then five even spokes out to a regular pentagon of orbs, out from the far orb
      piece(P(4, "M1920,1000 C1050,1000 900,540 648,540"), 9.62, 9.95, { ease: "sine.out" });
      [252, 324, 36, 108, 180].forEach((deg, i) => {
        const r = (deg * Math.PI) / 180, c = Math.cos(r), sn = Math.sin(r);
        piece(P(4, "M" + (560 + 100 * c).toFixed(1) + "," + (540 + 100 * sn).toFixed(1) + " L" + (560 + 194 * c).toFixed(1) + "," + (540 + 194 * sn).toFixed(1)), 9.98 + i * 0.2, 10.14 + i * 0.2, { ease: "power2.out", noHead: true });
      });
      piece(P(4, "M196,540 C100,540 80,960 0,960"), 12.0, 12.45, { ease: "sine.in", chain: true });
      // P5: in low, closes a loop around the El Al phone; the plane then takes off into the camera
      piece(P(5, "M1920,960 C1300,975 814,1000 814,790"), 12.45, 12.85, { ease: "sine.inOut", chain: true });
      piece(P(5, LOOP), 12.85, 13.55, { ease: "none" });
      tl.fromTo(".head b", { scale: 0.85 }, { scale: 1.15, duration: 0.18, yoyo: true, repeat: 80, ease: "sine.inOut", ...IR }, 0);

      // ---------- dust ----------
      const dl = $("#dustL");
      for (let i = 0; i < 40; i++) {
        const d = document.createElement("div"); d.className = "dust";
        d.style.cssText = "left:" + (rnd() * 1920).toFixed(0) + "px;top:" + (rnd() * 1080).toFixed(0) + "px;opacity:" + (0.1 + rnd() * 0.35).toFixed(2) + ";transform:scale(" + (0.5 + rnd() * 1.3).toFixed(2) + ")";
        dl.appendChild(d);
        tl.fromTo(d, { x: 0, y: 0 }, { x: 60 + rnd() * 120, y: -30 - rnd() * 60, duration: 16.8, ease: "none", ...IR }, 0);
      }
      tl.set("#dustL", { opacity: 1 }, 0);
      tl.set("#dustL", { opacity: 0 }, 15.3);

      // ---------- headlines ----------
      const words = (sel) => {
        const el = $(sel);
        Array.from(el.childNodes).forEach((n) => {
          if (n.nodeType === 3) {
            const f = document.createDocumentFragment();
            n.textContent.split(/(\s+)/).forEach((t) => { if (!t) return; if (/^\s+$/.test(t)) { f.appendChild(document.createTextNode(" ")); return; } const sp = document.createElement("span"); sp.className = "w"; sp.textContent = t; f.appendChild(sp); });
            n.replaceWith(f);
          } else if (n.nodeName === "EM") n.classList.add("w");
        });
        return $$(sel + " .w");
      };
      const headline = (sel, a, b) => {
        const ws = words(sel);
        ft(ws, { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.07 }, a);
        if (b != null) tl.to(ws, { opacity: 0, y: -36, filter: "blur(12px)", duration: 0.2, ease: "power2.in", stagger: 0.02 }, b - 0.22);
      };

      // P0
      ft("#t0 .w", { opacity: 0, scale: 1.35, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out", stagger: 0.18 }, 0.5);

      // P1
      ft("#ph1", { opacity: 0, rotationY: 28, z: -260 }, { opacity: 1, rotationY: -10, z: 0, duration: 0.9, ease: "expo.out" }, 1.85);
      tl.to("#ph1", { rotationY: -4, rotationX: 2, duration: 3.5, ease: "sine.inOut" }, 2.75);
      ft("#ph1 .shine i", { x: 0 }, { x: 700, duration: 1.2, ease: "power2.inOut" }, 2.2);
      headline("#h1", 1.95, 3.62);
      tl.set(["#sSt", "#sFuel2"], { opacity: 0 }, 0);
      tl.set("#sSt", { opacity: 1 }, 3.62); tl.set("#sSt", { opacity: 0 }, 4.64);
      tl.set("#sFuel2", { opacity: 1 }, 4.64);
      ft("#sSt", { y: 60 }, { y: 0, duration: 0.4, ease: "expo.out" }, 3.62);
      headline("#h2", 3.66, 4.64);
      [["#srch", 0], ["#row0", 0.07], ["#row1", 0.14], ["#row2", 0.21]].forEach(([s, d]) => {
        ft(s, { opacity: 0, x: -420, scale: 0.6 }, { opacity: 1, x: 0, scale: 1, duration: 0.55, ease: "expo.out" }, 3.62 + d);
        tl.to(s, { opacity: 0, x: 80, duration: 0.22, ease: "power2.in" }, 4.48 + d * 0.3);
      });
      ft("#tap1", { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1, opacity: 1, duration: 0.12 }, { scale: 1.6, opacity: 0, duration: 0.4 }] }, 4.12);
      headline("#h3", 4.68, 6.05);
      ft("#apay", { opacity: 0, scale: 0.5, x: -380 }, { opacity: 1, scale: 1, x: 0, duration: 0.6, ease: "back.out(1.4)" }, 4.7);
      tl.to("#apay", { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1 }, 5.3);
      ft("#tap2", { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1, opacity: 1, duration: 0.12 }, { scale: 1.7, opacity: 0, duration: 0.45 }] }, 5.3);
      ft("#paid", { opacity: 0, scale: 0.5, y: 24 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(2.2)" }, 5.68);

      // P2
      let bars = "", bx = 2;
      for (let i = 0; i < 46 && bx < 118; i++) { const w = 1 + ((i * 7) % 3); bars += '<rect x="' + bx + '" y="0" width="' + w + '" height="34" fill="#111"/>'; bx += w + 1 + ((i * 5) % 2); }
      $("#bars").innerHTML = bars;
      ft("#wal", { opacity: 0, rotationX: 16, y: 90 }, { opacity: 1, rotationX: 6, y: 0, duration: 0.8, ease: "expo.out" }, 6.3);
      tl.to("#wal", { rotationX: 2, rotationY: -4, duration: 2.0, ease: "sine.inOut" }, 7.1);
      ft("#code", { y: 0 }, { y: -250, duration: 0.65, ease: "back.out(1.3)" }, 7.12);
      tl.set("#code", { boxShadow: "0 6px 18px rgba(0,0,0,0.12), 0 0 0px 0px rgba(255,212,0,0)" }, 0);
      tl.to("#code", { boxShadow: "0 6px 18px rgba(0,0,0,0.12), 0 0 50px 6px rgba(255,212,0,0.55)", duration: 0.4 }, 7.5);
      headline("#h4", 6.3, null);
      ft("#l4", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 7.82);

      // P3
      ft("#punch", { opacity: 0, x: 240, scale: 0.85 }, { opacity: 1, x: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 8.4);
      ["#pr1", "#pr2", "#pr3", "#pr4"].forEach((s, i) => ft(s, { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.5)" }, 8.6 + i * 0.07));
      // stamps sit exactly on the card's own dotted circles (crop coords x 0.5525 scale)
      [893, 792, 692, 591, 491, 390].forEach((x, i) => {
        const s = document.createElement("div"); s.className = "stamp";
        s.style.cssText = "left:" + (x * 0.5525).toFixed(1) + "px;top:" + (282 * 0.5525).toFixed(1) + "px";
        s.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#111" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        $("#punch").appendChild(s);
        ft(s, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.18, ease: "back.out(3)" }, 8.95 + i * 0.1);
      });
      headline("#h5", 8.5, null);

      // P4
      ft("#o5", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 9.75);
      ["#o0", "#o1", "#o2", "#o3", "#o4"].forEach((o, i) => {
        ft(o, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.6)" }, 10.1 + i * 0.2);
        ft(o + " i", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.2 }, 10.15 + i * 0.2);
      });
      headline("#h6", 9.8, 11.4);
      ft("#ray", { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1.2, opacity: 1, duration: 0.25, ease: "power2.out" }, { scale: 1.5, opacity: 0.25, duration: 0.8 }] }, 11.42);
      tl.to("#o5", { scale: 1.3, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 11.42);
      tl.to(["#o0", "#o1", "#o2", "#o3", "#o4"], { scale: 1.08, duration: 0.18, yoyo: true, repeat: 1 }, 11.44);
      const n50 = $("#n50");
      ["₪0", "₪10", "₪20", "₪30", "₪40", "₪50"].forEach((v, i, arr) => {
        const sp = document.createElement("span"); sp.textContent = v; n50.appendChild(sp);
        tl.set(sp, { opacity: 0 }, 0);
        tl.set(sp, { opacity: 1 }, 11.44 + i * 0.07);
        if (i < arr.length - 1) tl.set(sp, { opacity: 0 }, 11.44 + (i + 1) * 0.07);

      ft("#gift", { opacity: 0, y: 90 }, { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" }, 11.72);

      ft("#ph5", { opacity: 0, rotationY: 26, z: -240 }, { opacity: 1, rotationY: -8, z: 0, duration: 0.9, ease: "expo.out" }, 12.45);
      tl.to("#ph5", { rotationY: -2, duration: 2.0, ease: "sine.inOut" }, 13.35);

      tl.set("#plane", { opacity: 0 }, 15.45);
      tl.to(["#ph5", "#h7"], { opacity: 0, duration: 0.3 }, 14.7);

      // P6 yellow bloom + the real logo
      ft("#bloom", { clipPath: "circle(0px at 960px 540px)" }, { clipPath: "circle(1200px at 960px 540px)", duration: 0.16, ease: "power1.in" }, 15.08);
      ft("#logoBand", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 15.45);

      // credits
      ft("#cred small", { opacity: 0, scaleX: 1.4 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "expo.out" }, 16.95);
      ft("#cred b", { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, 17.15);
      ft("#credl", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 17.45);

      window.__timelines = window.__timelines || {};
      const master = gsap.timeline({ paused: true });
      master.set("#ilogo", { scale: 0, opacity: 0, rotation: -12 }, 0);
      master.to("#ilogo", { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, 0.08);
      master.to("#ilogo", { scale: 1.06, duration: 0.25, ease: "sine.inOut" }, 0.5);
      master.to("#ilogo", { scale: 0, opacity: 0, rotation: 10, duration: 0.22, ease: "back.in(2)" }, 0.76);
      master.add(tl, 1.0);
      window.__timelines["main"] = master;
    </script>
