<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      @font-face { font-family: "Heebo"; font-weight: 900; src: url("assets/fonts/heebo-hebrew-900-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 900; src: url("assets/fonts/heebo-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Mono"; font-weight: 500; src: url("assets/fonts/jetbrains-mono-latin-500-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mono"; font-weight: 700; src: url("assets/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
      :root { --ink: #0b0d11; --acc: #1f63ff; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #c2c2c6; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Heebo", sans-serif; color: var(--ink); }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      .cap { position: absolute; left: 60px; right: 60px; top: 1330px; text-align: center; direction: rtl; font-size: 92px; font-weight: 900; line-height: 1.14; opacity: 0; }
      .cap span { display: inline-block; margin: 0 14px; }
      .cap .a { color: var(--acc); }
      .tag { position: absolute; left: 0; top: 0; font-family: "Mono", monospace; direction: ltr; white-space: nowrap; opacity: 0; }
      .tag small { display: block; font-size: 22px; font-weight: 500; letter-spacing: 4px; color: rgba(11, 13, 17, 0.55); }
      .tag b { display: block; font-size: 54px; font-weight: 700; letter-spacing: -1px; line-height: 1.05; color: var(--ink); }
      .tag b i { font-style: normal; color: rgba(11, 13, 17, 0.35); font-weight: 500; }
      .tag::before { content: ""; position: absolute; left: -64px; top: 46px; width: 48px; height: 2px; background: var(--ink); }
    </style>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three/three.module.js", "three/addons/": "./assets/vendor/three/addons/" } }
    </script>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.9" data-width="1080" data-height="1920" data-no-timeline>
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div class="tag" id="tagGas"><small id="gasS">GAS</small><b id="gasB">CH₄</b></div>
      <div class="tag" id="tagLayer"><small>LAYER</small><b><span id="ln">01</span><i> / 05</i></b></div>
      <div class="cap" id="c0"><span>גז</span><span>מתאן</span></div>
      <div class="cap" id="c1"><span>הופך</span><span class="a">לפלזמה</span><span>זוהרת</span></div>
      <div class="cap" id="c2"><span>ואטומי</span><span>פחמן</span></div>
      <div class="cap" id="c3"><span>נוחתים</span><span>על</span><span>הזרע</span></div>
      <div class="cap" id="c4"><span>שכבה</span><span>אחרי</span><span class="a">שכבה</span></div>
      <audio id="vo" src="assets/audio/vo_s06.mp3" data-start="0" data-duration="6.9" data-track-index="10" data-volume="1"></audio>
    </div>
    <script type="module">
      // Scene 06 of the abstract version: "everything is atoms". Carbon is a black lacquer ball in a pale photo studio.
      // A blue gas gathers over a frosted seed plate, lights up into plasma, and the atoms drop out of it and stack
      // layer after layer; every finished layer locks into pale crystal.
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

      const W = 1080, H = 1920, DUR = 6.9;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const inOutSine = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
      const outCubic = (x) => 1 - Math.pow(1 - x, 3);
      const outBack = (x) => 1 + 2.4 * Math.pow(x - 1, 3) + 1.4 * Math.pow(x - 1, 2);
      let seed = 23; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 0.92;
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;

      // ---------- the studio as an environment: a soft grey room and softboxes, seen only in the glossy objects ----------
      const envScene = new THREE.Scene();
      envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 64, 32), new THREE.ShaderMaterial({ side: THREE.BackSide,
        vertexShader: "varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: "varying vec3 vP; void main(){ float h = vP.y; vec3 c = mix(vec3(0.34), vec3(0.12), smoothstep(0.0, 0.7, h)); c = mix(c, vec3(0.55), smoothstep(-0.05, -0.5, h)); gl_FragColor = vec4(c, 1.0); }" })));
      const box = (w, h, x, y, z, I) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(I, I, I), side: THREE.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); envScene.add(m); };
      box(26, 14, 0, 30, 4, 40); box(6, 30, -26, 6, 10, 30); box(4, 26, 24, 5, -8, 16); box(4, 22, 18, 3, 24, 6);
      const envTex = new THREE.PMREMGenerator(renderer).fromScene(envScene, 0.035).texture;

      const scene = new THREE.Scene();
      const BG = new THREE.Color(0xc2c2c6); scene.background = BG; scene.fog = new THREE.Fog(BG, 22, 46);
      // seamless cyclorama
      const FY = -0.16;
      const pts = []; for (let i = 0; i <= 24; i++) { const a = (i / 24) * Math.PI / 2; pts.push(new THREE.Vector2(-7 - Math.sin(a) * 7, FY + (1 - Math.cos(a)) * 7)); }
      const prof = [new THREE.Vector2(20, FY), ...pts, new THREE.Vector2(-14, 26)];
      const cycGeo = new THREE.BufferGeometry(); { const pos = [], idx = [], X = [-30, 30];
        prof.forEach((p) => X.forEach((x) => pos.push(x, p.y, p.x)));
        for (let i = 0; i < prof.length - 1; i++) { const a = i * 2; idx.push(a, a + 2, a + 1, a + 1, a + 2, a + 3); }
        cycGeo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); cycGeo.setIndex(idx); cycGeo.computeVertexNormals(); }
      const floor = new THREE.Mesh(cycGeo, new THREE.MeshStandardMaterial({ color: 0x9c9ca2, roughness: 0.55, envMapIntensity: 0, side: THREE.DoubleSide })); floor.receiveShadow = true; scene.add(floor);
      const key = new THREE.DirectionalLight(0xffffff, 1.9); key.position.set(-3, 13, 4); key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048); const sc = key.shadow.camera; sc.left = sc.bottom = -5; sc.right = sc.top = 5; sc.far = 40; key.shadow.radius = 14; key.shadow.blurSamples = 24; key.shadow.bias = -0.0004;
      scene.add(key); scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d8dc, 2.3));

      // ---------- the seed: a frosted glass plate ----------
      const plate = new THREE.Mesh(new RoundedBoxGeometry(3.1, 0.16, 3.1, 6, 0.07),
        new THREE.MeshPhysicalMaterial({ envMap: envTex, color: 0xe9f1ff, roughness: 0.32, transmission: 0.92, thickness: 0.5, ior: 1.5, envMapIntensity: 1.2, clearcoat: 1, clearcoatRoughness: 0.08 }));
      plate.position.y = -0.08; plate.castShadow = true; scene.add(plate);

      // ---------- the atoms ----------
      const R = 0.2, SP = 0.46, LH = 0.42, NL = 5, G = 5, N = NL * G * G, CY = 4.05;
      const atomMat = new THREE.MeshPhysicalMaterial({ envMap: envTex, color: 0xffffff, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 1.6 });
      const atoms = new THREE.InstancedMesh(new THREE.SphereGeometry(R, 40, 28), atomMat, N); atoms.castShadow = true; atoms.receiveShadow = true; atoms.frustumCulled = false; scene.add(atoms);
      const BLACK = new THREE.Color(0x020203), ICE = new THREE.Color(0xcfe0ff), col = new THREE.Color();
      const L0 = 2.95, LD = 0.62;                       // first layer starts dropping; one layer every LD seconds
      const A = [];
      for (let l = 0; l < NL; l++) for (let i = 0; i < G; i++) for (let j = 0; j < G; j++) {
        const x = (i - 2) * SP, z = (j - 2) * SP, y = R + l * LH;
        A.push({ l, x, y, z, t0: L0 + l * LD + rnd() * 0.36, tc: L0 + l * LD + 0.98 + (i + j) * 0.022,
          a0: rnd() * 6.283, w: (0.5 + rnd() * 0.9) * (rnd() < 0.5 ? -1 : 1), rho: 0.25 + Math.sqrt(rnd()) * 1.0, h: (rnd() - 0.5) * 0.85, ph: rnd() * 6.283, born: 0.15 + rnd() * 0.9 });
      }
      const M = new THREE.Matrix4(), P = new THREE.Vector3(), Q = new THREE.Quaternion(), S = new THREE.Vector3();
      atoms.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(N * 3), 3);

      // ---------- the gas: soft blue volumes that light up into plasma ----------
      const blob = (stops) => { const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d"), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
        stops.forEach(([o, s]) => gr.addColorStop(o, s)); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
      const gasTex = blob([[0, "rgba(40,105,255,0.55)"], [0.45, "rgba(60,120,255,0.22)"], [1, "rgba(80,140,255,0)"]]);
      const coreTex = blob([[0, "rgba(255,255,255,0.95)"], [0.25, "rgba(170,205,255,0.6)"], [0.6, "rgba(70,130,255,0.18)"], [1, "rgba(70,130,255,0)"]]);
      const gas = []; for (let i = 0; i < 9; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: gasTex, transparent: true, depthWrite: false, fog: false })); s.renderOrder = 5;
        gas.push({ s, a: rnd() * 6.283, w: 0.25 + rnd() * 0.4, r: 0.2 + rnd() * 0.75, h: (rnd() - 0.5) * 0.5, sz: 2.2 + rnd() * 1.4, ph: rnd() * 6.283 }); scene.add(s); }
      const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: coreTex, transparent: true, depthWrite: false, fog: false })); core.renderOrder = 6; core.position.set(0, CY, 0); scene.add(core);
      const glow = new THREE.PointLight(0x2f6dff, 0, 12, 1.6); glow.position.set(0, CY - 0.4, 0); scene.add(glow);
      // a thin ring that snaps outward when the gas ignites
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 12, 160), new THREE.MeshBasicMaterial({ color: 0x1f63ff, transparent: true, opacity: 0, fog: false, depthWrite: false })); ring.rotation.x = Math.PI / 2; ring.position.y = CY; scene.add(ring);

      const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 120);
      const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera)); composer.addPass(new OutputPass());
      const lens = new ShaderPass({ uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time) * 43758.5453); }
          void main(){ vec3 c = texture2D(tDiffuse, vUv).rgb; c *= mix(0.88, 1.0, smoothstep(1.05, 0.35, length((vUv - 0.5) * vec2(0.9, 1.0))));
            c += (hash(floor(vUv * vec2(1080.0, 1920.0))) - 0.5) * 0.016; gl_FragColor = vec4(c, 1.0); }` });
      composer.addPass(lens);

      // ---------- captions and tags (DOM, driven by the same clock) ----------
      const CAPS = [[0.2, 0.92, [0.24, 0.48]], [0.92, 2.76, [0.96, 1.4, 1.96]], [2.76, 3.62, [2.84, 3.24]], [3.62, 4.82, [3.68, 4.16, 4.32]], [4.82, 6.9, [4.88, 5.36, 5.76]]];
      const capEls = CAPS.map((_, i) => document.getElementById("c" + i));
      const tagGas = document.getElementById("tagGas"), tagLayer = document.getElementById("tagLayer"), ln = document.getElementById("ln"), gasS = document.getElementById("gasS"), gasB = document.getElementById("gasB");
      const proj = new THREE.Vector3();
      const place = (el, x, y, z, dx, dy) => { proj.set(x, y, z).project(camera); el.style.transform = "translate(" + Math.min(W - 250, (proj.x * 0.5 + 0.5) * W + dx).toFixed(1) + "px," + ((-proj.y * 0.5 + 0.5) * H + dy).toFixed(1) + "px)"; };

      const IGN = 1.4, target = new THREE.Vector3();
      function renderAt(t) {
        t = clamp(t, 0, DUR - 1e-4);
        // camera: one slow orbit that drifts in
        const k = inOutSine(seg(t, 0, DUR)), ang = lerp(0.62, 0.2, k), dist = lerp(17.6, 16.2, k);
        camera.position.set(Math.sin(ang) * dist, lerp(3.5, 2.7, k), Math.cos(ang) * dist); target.set(0, lerp(1.0, 1.22, k), 0); camera.lookAt(target); camera.updateMatrixWorld();

        // gas gathers, then ignites
        const form = outCubic(seg(t, 0.0, 1.2)), ign = seg(t, IGN, IGN + 0.5), hot = outCubic(ign), spent = seg(t, 5.9, 6.7);
        gas.forEach((g) => { const a = g.a + t * g.w, r = g.r * lerp(2.4, 1, form);
          g.s.position.set(Math.cos(a) * r, CY + g.h + Math.sin(t * 0.9 + g.ph) * 0.08, Math.sin(a) * r);
          const sz = g.sz * lerp(0.5, 1, form) * (1 + 0.06 * Math.sin(t * 2.2 + g.ph)) * (1 + 0.18 * hot); g.s.scale.set(sz, sz * 0.72, 1);
          g.s.material.opacity = form * lerp(0.75, 1, hot) * lerp(1, 0.55, spent); });
        const pulse = 1 + 0.07 * Math.sin(t * 9) * hot; core.scale.setScalar(lerp(0.4, 3.0, hot) * pulse); core.material.opacity = hot * 0.95 * lerp(1, 0.6, spent);
        glow.intensity = hot * 9 * pulse;
        const rk = seg(t, IGN, IGN + 0.7); ring.scale.setScalar(lerp(0.3, 2.3, outCubic(rk))); ring.visible = rk > 0 && rk < 1; ring.material.opacity = (1 - rk) * 0.9;

        // atoms: swirl inside the gas, drop, settle, then lock into crystal layer by layer
        let top = 0;
        for (let n = 0; n < N; n++) { const a = A[n];
          const an = a.a0 + t * a.w, sx = Math.cos(an) * a.rho, sz = Math.sin(an) * a.rho, sy = CY + a.h * 0.75 + Math.sin(t * 1.7 + a.ph) * 0.06;
          const d = seg(t, a.t0, a.t0 + 0.52), land = t - (a.t0 + 0.52);
          let x = sx, y = sy, z = sz, s = 0.5 * outBack(seg(t, a.born, a.born + 0.35)), sq = 1;
          if (d > 0) { const kx = outCubic(d), ky = d * d; x = lerp(sx, a.x, kx); z = lerp(sz, a.z, kx); y = lerp(sy, a.y, ky); s = lerp(0.5, 1, kx); }
          if (land >= 0) { sq = 1 - 0.2 * Math.exp(-9 * land) * Math.cos(land * 26); if (a.l + 1 > top) top = a.l + 1; }
          const c = seg(t, a.tc, a.tc + 0.24); if (c > 0) s *= 1 + 0.16 * Math.sin(Math.PI * c);
          P.set(x, y - (1 - sq) * R, z); S.set(s * (2 - sq), s * sq, s * (2 - sq)); M.compose(P, Q, S); atoms.setMatrixAt(n, M);
          col.copy(BLACK).lerp(ICE, c * c * (3 - 2 * c)); atoms.setColorAt(n, col);
        }
        atoms.instanceMatrix.needsUpdate = true; atoms.instanceColor.needsUpdate = true;

        // DOM
        CAPS.forEach(([a, b, ws], i) => { const el = capEls[i], on = t >= a - 0.04 && t < b; el.style.opacity = on ? 1 : 0; if (!on) return;
          [...el.children].forEach((sp, j) => { const q = seg(t, ws[j] - 0.03, ws[j] + 0.16), e = outBack(q); sp.style.opacity = q; sp.style.transform = "translateY(" + ((1 - e) * 34).toFixed(1) + "px) scale(" + (0.86 + 0.14 * e).toFixed(3) + ")"; }); });
        const gq = seg(t, 0.3, 0.6) * (1 - seg(t, 2.6, 2.9)); tagGas.style.opacity = gq; place(tagGas, 1.45, CY + 0.3, 0, 70, -40);
        const isP = t >= IGN; gasS.textContent = isP ? "PLASMA" : "GAS"; gasB.textContent = isP ? "C + H" : "CH₄";
        const lq = seg(t, 3.5, 3.8); tagLayer.style.opacity = lq; ln.textContent = "0" + Math.max(1, top);
        place(tagLayer, 1.15, R + (Math.max(1, top) - 1) * LH, 0, 80, -46);

        lens.uniforms.time.value = Math.floor(t * 60);
        composer.render();
      }
      window.__hf = window.__hf || {}; window.__hf.buildReady = window.__hf.buildReady || {}; window.__hf.buildReady["s06"] = Promise.resolve();
      renderAt(window.__hfThreeTime || 0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__renderAt = renderAt;
    </script>
  </body>
</html>
