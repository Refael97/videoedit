        CAPS.forEach(([a, b, ws], i) => { const el = capEls[i], vis = t >= a - 0.04 && t < b; el.style.opacity = vis ? 1 : 0; if (!vis) return; const card = el.firstElementChild, e = outBack(seg(t, a - 0.04, a + 0.24));
          card.style.transform = "translateY(" + ((1 - e) * 36).toFixed(1) + "px) scale(" + (0.8 + 0.2 * e).toFixed(3) + ")";
          [...card.children].forEach((sp, j) => { const q = seg(t, ws[j] - 0.03, ws[j] + 0.14); sp.style.opacity = (0.18 + 0.82 * q).toFixed(3); sp.style.transform = "translateY(" + ((1 - outBack(q)) * 12).toFixed(1) + "px)"; }); });
      }
      const tl = gsap.timeline({ paused: true }), pr = { t: 0 };
      tl.to(pr, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(pr.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
    </script>
  </body>
</html>
