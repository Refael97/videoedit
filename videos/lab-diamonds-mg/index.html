<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Heebo"; font-weight: 900; src: url("assets/fonts/heebo-hebrew-900-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+FB1D-FB4F; }
      @font-face { font-family: "Heebo"; font-weight: 900; src: url("assets/fonts/heebo-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #fdefd6; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fdefd6; font-family: "Heebo", sans-serif; }
      #clip { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* captions: a cream card with a thick ink outline, like a part of the machine */
      .cap { position: absolute; left: 0; right: 0; top: 1392px; text-align: center; direction: rtl; display: none; }
      .cap div { display: inline-block; padding: 14px 38px 18px; border-radius: 34px; background: #fff7e8; border: 6px solid #23323c; box-shadow: 0 10px 0 #23323c; font-size: 84px; font-weight: 900; line-height: 1.1; color: #23323c; white-space: nowrap; }
      .cap span { display: inline-block; margin: 0 11px; }
      .cap .a { color: #8a3ffc; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1080" data-height="1920">
      <video id="clip" src="assets/video/machineB.mp4" muted playsinline data-start="0" data-duration="5" data-track-index="1"></video>
      <div class="cap" id="c0"><div><span>גז</span><span>מתאן</span></div></div>
      <div class="cap" id="c1"><div><span>הופך</span><span class="a">לפלזמה</span><span>זוהרת</span></div></div>
      <div class="cap" id="c2"><div><span>ואטומי</span><span>פחמן</span></div></div>
      <div class="cap" id="c3"><div><span>נוחתים</span><span>על</span><span class="a">הזרע</span></div></div>
      <audio id="vo" src="assets/audio/vo_sB.mp3" data-start="0" data-duration="5" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const CAPS = [[0.1, 0.8, [0.14, 0.38]], [0.8, 2.66, [0.86, 1.3, 1.86]], [2.66, 3.52, [2.74, 3.14]], [3.52, 5, [3.58, 4.06, 4.22]]];
      CAPS.forEach(([a, b, ws], i) => { const el = document.getElementById("c" + i), card = el.firstElementChild;
        tl.set(el, { display: "none" }, 0); tl.set(el, { display: "block" }, a); if (b < 5) tl.set(el, { display: "none" }, b);
        tl.fromTo(card, { scale: 0.8, y: 30 }, { scale: 1, y: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, a);
        [...card.children].forEach((sp, k) => { tl.set(sp, { opacity: 0.18 }, 0); tl.fromTo(sp, { opacity: 0.18, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "back.out(2)", immediateRender: false }, ws[k] - 0.03); }); });
      tl.set({}, {}, 5);
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
    </script>
  </body>
</html>
