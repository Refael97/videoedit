<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/theme/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme/tokens.css" />
    <link rel="stylesheet" href="assets/theme/theme.css" />
    <script src="assets/theme/motion.js"></script>
    <style>
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #face { position: absolute; left: 0; top: -30px; width: 1080px; height: 1964px; object-fit: cover; }
      /* tight selfie framing (language.md §5): the glass lives above the head (y 60-320) and on the dark
         sweater under the caption line (y 1530-1870), never beside the face */
      .g-hook { top: 70px; }
      #strip { left: 70px; top: 1550px; width: 940px; height: 220px; }
      #map { left: 120px; top: 1535px; width: 840px; height: 330px; padding: 0; overflow: hidden; }
      #map .pin { left: 78%; top: 30%; }
      #chat { left: 120px; top: 1525px; width: 840px; height: 350px; }
      #chat .body { display: flex; flex-direction: column; justify-content: flex-end; height: 290px; padding-bottom: 14px; }
      #chat .g-bubble { font-size: 30px; }
      #pip { left: 330px; top: 1545px; width: 420px; height: 300px; }
      #esc { position: absolute; left: 340px; top: 1555px; width: 400px; height: 280px; border-radius: 22px; background: url(assets/img/thumb2.jpg) center / cover; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }
      #zt { left: 320px; top: 250px; }
      #list { left: 240px; top: 1520px; width: 600px; }
      #list .row { height: 66px; font-size: 32px; }
      #list .head { font-size: 34px; }
      .st { position: absolute; }
      #portal { left: 390px; top: 1550px; width: 300px; height: 300px; }
      #pay { left: 250px; top: 150px; }
      #pay.g-tag { height: 120px; font-size: 64px; padding: 0 22px 0 36px; border-radius: 30px; }
      #pay .ic, #pay .ic svg { width: 76px; height: 76px; }
    </style>
  </head>
  <body>
    <div id="root" class="g-root" data-composition-id="main" data-start="0" data-duration="18.6" data-width="1080" data-height="1920">
      <div id="cam" class="g-cam">
        <video id="face" src="assets/video/face.mp4" data-start="0" data-duration="18.6" data-track-index="0" muted playsinline></video>

        <!-- opening + ending: the video being edited, as a glass timeline strip -->
        <div id="strip" class="g-card m-light g-strip aa"><div class="ruler"></div><div class="thumbs"></div><svg class="wave"></svg><i class="head"></i>
          <svg class="curve" viewBox="0 0 900 118" preserveAspectRatio="none"><path id="curve" d="M0 110 C120 108 200 100 300 88 S480 70 560 52 S760 20 900 6" /></svg></div>

        <!-- "מסלול": abstract map, the route draws, the pin lands -->
        <div id="map" class="g-card m-light g-map aa"><div class="pin" id="pin"></div></div>

        <!-- "השתלטות צ'אט": the chat fills until it takes over the window -->
        <div id="chat" class="g-card m-win aa"><div class="bar"><i></i><i></i><i></i><span>Claude</span></div>
          <div class="body">
            <div class="g-bubble out cb">תערוך את הסרטון הזה</div>
            <div class="g-bubble in cb">מוסיף מסלול ✓</div>
            <div class="g-bubble in cb">משתלט על הצ'אט ✓</div>
            <div class="g-bubble in cb">עוד רגע הכול מוכן…</div>
          </div></div>

        <!-- "בריחה מהפריים": a frame, the picture breaks out of it -->
        <div id="pip" class="g-card m-light g-pip aa"><div class="in" style="background-image: url(assets/img/thumb2.jpg)"></div></div>
        <div id="esc" class="aa"></div>

        <!-- "זום חד": a tag above the head names the punch -->
        <div id="zt" class="g-tag aa"><span class="ic" id="ztIc"></span><span id="ztT">זום חד <span dir="ltr">×1.18</span></span></div>

        <!-- "רשימה קופצת": the list of effects so far pops in -->
        <div id="list" class="g-card m-win g-list aa"><div class="bar"><i></i><i></i><i></i><span>Effects</span></div>
          <div class="body"><div class="head">האפקטים</div>
            <div class="row lr"><span class="box"><b></b></span>מסלול</div>
            <div class="row lr"><span class="box"><b></b></span>השתלטות צ'אט</div>
            <div class="row lr"><span class="box"><b></b></span>בריחה מהפריים</div>
            <div class="row lr"><span class="box"><b></b></span>זום חד</div></div></div>

        <!-- "סערת כותרות": the headlines storm in -->
        <div class="g-tag sm st aa" style="left: 120px; top: 1540px"><span class="ic"></span>מסלול</div>
        <div class="g-tag sm st aa" style="left: 560px; top: 1580px"><span class="ic"></span>השתלטות צ'אט</div>
        <div class="g-tag sm st aa" style="left: 200px; top: 1650px"><span class="ic"></span>בריחה מהפריים</div>
        <div class="g-tag sm st aa" style="left: 640px; top: 1700px"><span class="ic"></span>זום חד</div>
        <div class="g-tag sm st aa" style="left: 300px; top: 1770px"><span class="ic"></span>רשימה קופצת</div>
        <div class="g-tag sm st aa" style="left: 700px; top: 1790px"><span class="ic"></span>סערת כותרות</div>

        <!-- "פורטל זום": the camera flies into a glass portal -->
        <div id="portal" class="g-card m-light g-portal aa"><div class="in" style="background-image: url(assets/img/thumb3.jpg)"></div></div>

        <!-- payoff over the head: the count lands on "צמיחה" -->
        <div id="pay" class="g-tag aa"><span class="ic" id="payIc"></span><span id="payN">0 אפקטים</span></div>
      </div>

      <div id="hook" class="g-hook"><span class="l1">קלוד, תערוך את הסרטון הזה</span><span class="l2">ותוסיף אפקטים</span></div>
      <div id="caps" class="g-caps"></div>

      <audio id="vo" src="assets/audio/vo.mp3" data-start="0" data-duration="18.6" data-track-index="10" data-volume="1"></audio>
<!--__SFX__-->
    </div>
    <script>
      const WORDS = __WORDS__;
      const G = window.GLASS;
      const tl = gsap.timeline({ paused: true });

      // ---- build DOM ----
      const effects = ["מסלול", "צ'אט", "בריחה", "זום", "רשימה", "כותרות", "פורטל", "צמיחה"];
      G.strip("#strip", { n: 8, thumbs: ["assets/img/thumb1.jpg", "assets/img/thumb2.jpg", "assets/img/thumb3.jpg"], ruler: ["00:00", "00:05", "00:10", "00:15", "00:18"],
        marks: effects.map((e, i) => ({ text: e, at: 0.06 + i * 0.125 })) });
      G.map("#map", { seed: 5, streets: 8, route: [[10, 85], [30, 70], [42, 72], [55, 48], [68, 40], [78, 30]] });
      document.querySelectorAll("#list .box b").forEach((e) => (e.innerHTML = G.TICK));
      document.querySelectorAll(".st .ic").forEach((e) => (e.innerHTML = G.ICONS.spark));
      document.querySelector("#ztIc").innerHTML = G.ICONS.clip;
      document.querySelector("#payIc").innerHTML = G.CHECK;
      // the strip's markers alternate above/below so the names never overlap
      document.querySelectorAll("#strip .mk").forEach((m, i) => (m.style.top = i % 2 ? "120px" : "-4px"));

      ["#strip", "#map", "#pin", "#chat", "#pip", "#esc", "#zt", "#list", ".st", "#portal", "#pay", "#strip .mk", "#curve"].forEach((s) => G.hide(tl, s));

      // ---- camera: a punch (or the portal) every 2-4 s, drift between ----
      G.zoomInit(tl, "#cam", 1.0, 0, 0);
      G.drift(tl, "#cam", 0, 3.5);
      G.zoom(tl, "#cam", 3.6, 1.06, 0, -30);
      G.drift(tl, "#cam", 3.75, 5.0);
      G.zoom(tl, "#cam", 8.92, 1.18, 0, 60);
      G.zoom(tl, "#cam", 10.86, 1.0, 0, 0);
      G.zoom(tl, "#cam", 13.04, 1.06, 0, -30);
      G.drift(tl, "#cam", 13.2, 1.8);
      tl.to("#cam", { scale: 2.6, x: 0, y: -2080, duration: 0.42, ease: "power2.in" }, 15.6);   // into the portal (origin 540,864 → portal 540,1700)
      tl.set("#cam", { scale: 1.0, x: 0, y: 0 }, 16.04);                                              // out the other side, hard
      G.drift(tl, "#cam", 16.1, 2.5);

      // ---- hook over the strip (opening visual: the video being edited) ----
      G.hook(tl, "#hook", 0.05, 3.55);
      G.spaceIn(tl, "#strip", 0.15);
      G.stripFill(tl, "#strip", 0.35, 0.08);
      G.playhead(tl, "#strip", 0.3, 3.2, 0, 0.36);
      G.exit(tl, "#strip", 3.55);
      G.captions(tl, "#caps", WORDS.filter((w) => w.start >= 3.55), { maxWords: 3 });

      // ---- מסלול ----
      G.spaceIn(tl, "#map", 3.62);
      G.route(tl, "#map", 3.72, 0.9);
      G.confirm(tl, "#pin", 4.62);
      G.exit(tl, "#map", 5.0);

      // ---- השתלטות צ'אט ----
      G.appear(tl, "#chat", 5.06, "win");
      G.fill(tl, "#chat .cb", [5.1, 5.45, 5.75, 6.05]);
      G.emphasize(tl, "#chat", 6.2);
      G.exit(tl, "#chat", 6.86);

      // ---- בריחה מהפריים ----
      G.spaceIn(tl, "#pip", 6.92);
      tl.set("#esc", { opacity: 1 }, 7.32);
      tl.fromTo("#esc", { scale: 1, y: 0, x: 0 }, { scale: 1.18, y: -40, x: 140, duration: 0.42, ease: "back.out(1.6)", immediateRender: false }, 7.32);
      tl.to("#pip .in", { opacity: 0.25, duration: 0.2 }, 7.32);
      G.exit(tl, ["#pip", "#esc"], 8.82);

      // ---- זום חד ----
      G.tag(tl, "#zt", 9.0);
      G.emphasize(tl, "#zt", 9.28);
      G.exit(tl, "#zt", 10.8);

      // ---- רשימה קופצת ----
      G.appear(tl, "#list", 10.92, "win");
      G.pop(tl, "#list .lr", 11.05, 0.2);
      G.check(tl, "#list .box b", 11.6, 0.12);
      G.exit(tl, "#list", 12.98);

      // ---- סערת כותרות ----
      G.multiply(tl, ".st", 13.08, 5);
      G.exit(tl, ".st", 14.96);

      // ---- פורטל זום ----
      G.spaceIn(tl, "#portal", 15.1);
      tl.set("#portal", { opacity: 0 }, 16.04);

      // ---- עקומת צמיחה: the strip returns with every effect on it, the curve climbs, the count lands on "צמיחה" ----
      G.spaceIn(tl, "#strip", 16.1);
      G.playhead(tl, "#strip", 16.1, 1.5, 0.36, 1.0);
      document.querySelectorAll("#strip .mk").forEach((m, i) => { { tl.set(m, { opacity: 0, y: -46, scale: 0.6 }, 0); tl.fromTo(m, { opacity: 0, y: -46, scale: 0.6 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2.2)", immediateRender: false }, 16.2 + i * 0.11); } });
      G.swap(tl, "#strip .mk", 17.62, "on");
      tl.set("#curve", { opacity: 1 }, 17.12);
      G.draw(tl, "#curve", 17.12, 0.5, "power1.in");
      G.tag(tl, "#pay", 16.4, "50% 50%");
      G.count(tl, "#payN", 0, 8, 16.5, 1.12, { suffix: " אפקטים" });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
