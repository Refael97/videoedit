        { a: 8.72, b: 9.25, p0: add(X3, 4, 12, 86), p1: add(X3, 3, 13, 90), l0: add(X3, 3, 7, 0), l1: add(X3, 3, 7, 0), e: E.outCubic },
        { a: 9.25, b: T.S4, p0: add(X3, 3, 13, 90), p1: add(X3, 6.5, 5.3, 6), l0: add(X3, 3, 7, 0), l1: add(X3, 6.5, 5.1, 0), e: E.inExpo },
      ];

      const flash = $("#flash"), pause = $("#pause"), label = $("#label"), dots = $("#dots"), iris = $("#iris");
      const s6 = $("#s6"), s7 = $("#s7");
      function renderAt(t) {
        if (!ready) return;
        let shake = 0, chroma = 0.002, blur = 0, fl = 0, fov = 42, roll = 0;
        const hit = (ti, a = 1, r = 12) => (t >= ti ? a * Math.exp(-(t - ti) * r) : 0);
        const darkMode = t >= T.S5 && t < T.S6;
        rpass.scene = darkMode ? dark : scene;
        bloom.strength = darkMode ? 0.45 + 0.7 * hit(12.66, 1, 6) : 0;
        fx.uniforms.vig.value = darkMode ? 0.55 : 0.86;

        // --- S1 ---
        const sim = (x) => (x < F1 ? x : x < UNF ? F1 : x - (UNF - F1));
        const st = sim(t); const inS1 = t < T.S2;
        letters.forEach((g, i) => {
          const s = 0.06 + i * 0.03, e = T_IMP - 0.02 + i * 0.02; const k = seg(st, s, e);
          g.visible = st >= s; g.position.y = lerp(95, 0, E.inQuad(k)); g.rotation.z = lerp(i ? 0.6 : -0.5, 0, E.inQuad(k));
          const sq = st > e ? 1 - 0.2 * Math.exp(-(st - e) * 13) * Math.cos((st - e) * 34) : 1; g.scale.set(2 - sq, sq, 1);
        });
        puncts.forEach((g, i) => {
          const s = 0.38 + i * 0.08; const k = seg(st, s, s + 0.3);
          g.visible = st >= s; g.scale.setScalar(Math.max(0.001, E.outBack(k)));
          g.position.y = Math.sin(Math.PI * clamp(k * 1.4)) * 7; g.rotation.y = (1 - E.outCubic(k)) * 3.2;
        });
        stepConfetti(conf1, v3(0, 0, 0), inS1 ? st - T_IMP : -1);

        // --- S2: star rises, cards orbit, all dive into the crate, lid slams ---
        const s2t = t - T.S2;
        star.visible = t >= 3.62 && t < 5.72;
        star.scale.setScalar(Math.max(0.001, E.outBack(seg(t, 3.64, 4.0)) * (1 + 0.18 * hit(4.82, 1, 8)) * (1 - E.inCubic(seg(t, 5.36, 5.68)))));
        star.rotation.z = -t * 1.6; star.rotation.y = Math.sin(t * 1.3) * 0.35;
        star.position.y = lerp(14, 6, E.inCubic(seg(t, 5.36, 5.68)));
        star.position.z = lerp(-6, 8, E.inCubic(seg(t, 5.36, 5.68)));
        cardMeshes.forEach((m, i) => {
          const tin = 3.9 + i * 0.12; const k = E.outBack(seg(t, tin, tin + 0.35));
          const ang = (i / 5) * Math.PI * 2 + s2t * 1.1;
          const ox = Math.sin(ang) * 13, oz = Math.cos(ang) * 10 - 6, oy = 9 + Math.sin(ang * 2 + i) * 1.5;
          const from = v3(Math.sin(ang) * 120, 40 + i * 6, Math.cos(ang) * 90);
          const dive = E.inCubic(seg(t, 5.3 + i * 0.06, 5.58 + i * 0.06));
          m.visible = t >= tin && dive < 1;
          m.position.set(lerp(lerp(from.x, ox, k), 0, dive), lerp(lerp(from.y, oy, k), 5, dive), lerp(lerp(from.z, oz, k), 8, dive));
          m.rotation.set(lerp(0, -1.4, dive), lerp(ang, 0, dive) + (1 - k) * 2, lerp(Math.sin(ang) * 0.08, 0, dive));
          m.scale.setScalar(lerp(0.78, 0.45, dive));
        });
        const cr = E.outBack(seg(t, 5.2, 5.5)); crate.visible = t >= 5.2; crate.position.y = lerp(-14, 0, cr);
        const lidK = seg(t, 5.6, 5.76); lidPivot.rotation.x = lerp(-1.95, 0, E.inQuad(lidK));
        const bounce = t > 5.76 ? Math.exp(-(t - 5.76) * 6) * Math.sin((t - 5.76) * 22) : 0;
        crate.scale.set(1 + 0.08 * bounce, 1 - 0.1 * bounce, 1 + 0.08 * bounce);
        stepConfetti(conf2, add(X2, 0, 10, 8), t >= T.S2 && t < T.S3 ? t - 5.76 : -1, 0.08, 0.6);

        // --- S3: reels spin and land on 5 / 0 / 0 / 0; alarm light; "!!" ---
        const LAND = [7.94, 8.12, 8.3, 8.48], TARGET = [5, 0, 0, 0];
        reels.forEach((m, i) => {
          const t0 = 6.5, t1 = LAND[i]; const k = seg(t, t0, t1);
          const spins = 9 + i * 2; const final = digitAngle(TARGET[i]) + spins * Math.PI * 2;
          const ease = 1 - Math.pow(1 - k, 3);
          m.rotation.x = -(final * ease) - (t > t1 ? 0.06 * Math.exp(-(t - t1) * 10) * Math.sin((t - t1) * 40) : 0);
        });
        comma.visible = t >= 8.12; comma.scale.setScalar(Math.max(0.001, E.outBack(seg(t, 8.12, 8.3))));
        shek.visible = t >= 8.7; shek.scale.setScalar(Math.max(0.001, E.outBack(seg(t, 8.72, 8.95)))); shek.rotation.y = (1 - E.outCubic(seg(t, 8.72, 9.1))) * 6;
        bang.visible = t >= 8.86; bang.position.y = lerp(60, 17.5, E.inQuad(seg(t, 8.86, 9.02)));
        const inS3 = t >= T.S3 && t < T.S4;
        alarm.position.set(X3.x + Math.sin(t * 9) * 18, 12, 14); alarm.intensity = inS3 && t > 8.7 ? 900 * (0.6 + 0.4 * Math.sin(t * 24)) : 0;

        // --- S4 ---
        if (emo) { emo.rotation.y = Math.sin(t * 1.1) * 0.12; const sc = 1 + 0.04 * Math.sin(t * 10) * seg(t, 11.66, 12.6); emo.scale.setScalar(sc); }

        // --- S5: "אפשר!!" flies in from behind the camera ---
        AF.userData.glyphs.forEach((g, i) => {
          const j = AF.userData.glyphs.length - 1 - i; const s = 12.62 + j * 0.03; const k = seg(t, s, s + 0.16);
          g.visible = t >= s; g.position.z = lerp(110, 0, E.outExpo(k)); g.rotation.x = lerp(-1.2, 0, E.outExpo(k));
          const e = s + 0.16; const sq = t > e ? 1 + 0.25 * Math.exp(-(t - e) * 12) * Math.sin((t - e) * 36) : 1; g.scale.set(1, sq, 1);
        });
        stepConfetti(conf5, v3(0, 2, 0), darkMode ? t - 12.7 : -1, 0.05, 1.1);

        // ===== camera per scene =====
        if (t < T.S2) {
          placeSun(v3(0, 0, 0));
          const sh = fromShots(S1SHOTS, t);
          shake += hit(T_IMP, 1, 9); [F1, F2, F3].forEach((f) => { shake += hit(f, 0.8, 14); chroma += hit(f, 0.02, 16); fl += hit(f, 0.6, 22); });
          chroma += hit(T_IMP, 0.02, 10);
          blur = Math.pow(seg(t, UNF, T.S2), 2) * 9;
          pause.style.opacity = t >= F1 && t < UNF ? "1" : "0";
          const lastF = [F1, F2, F3].filter((f) => t >= f).pop();
          pause.style.transform = `scale(${t >= F1 && t < UNF ? (1 + 0.18 * Math.exp(-(t - lastF) * 12)).toFixed(3) : 1})`;
        } else if (t < T.S3) {
          placeSun(X2); fromShots(S2SHOTS, t);
          blur = Math.pow(1 - seg(t, T.S2, 3.85), 2) * 9 + Math.pow(seg(t, 6.25, T.S3), 2) * 10;
          shake += hit(5.76, 1.1, 10) + hit(4.82, 0.3, 12); chroma += hit(5.76, 0.02, 10);
          roll = Math.sin(t * 1.2) * 0.02;
        } else if (t < T.S4) {
          placeSun(X3); fromShots(S3SHOTS, t);
          blur = Math.pow(1 - seg(t, T.S3, 6.62), 2) * 10 + Math.pow(seg(t, 9.35, T.S4), 2) * 6;
          LAND.forEach((l) => (shake += hit(l, 0.35, 16)));
          shake += hit(8.74, 1.0, 9) + hit(9.0, 0.7, 10); chroma += hit(8.74, 0.025, 9);
          roll = lerp(0.12, 0.05, seg(t, T.S3, 8.7)) + hit(8.74, 0.05, 8);
          fl += hit(T.S4 - 0.06, 0, 1);
        } else if (t < T.S5) {
          // dolly zoom: pull back while the lens narrows so 😱 holds its size and the world stretches
          placeSun(X4);
          const k = E.inOutSine(seg(t, T.S4, 11.7));
          const target = add(X4, 0, 15.5, 0);
          const half = 30; // the emoji holds ~half the frame height
          fov = lerp(88, 22, k);
          const dist = half / Math.tan(THREE.MathUtils.degToRad(fov / 2));
          const creep = seg(t, 11.66, T.S5);
          camPos.set(target.x + Math.sin(k * 0.6) * dist * 0.12, target.y + 2 + k * 6, target.z + dist * Math.cos(k * 0.6) * (1 - 0.18 * E.inCubic(creep)));
          camLook.copy(target);
          fl += hit(T.S4, 0.7, 10);
          shake += 0.05 * Math.sin(t * 40) * creep;
        } else {
          // S5 dark
          const k = seg(t, T.S5, T.S6);
          camPos.set(lerp(-6, 6, k), lerp(9, 11, k), lerp(104, 94, E.outCubic(k)));
          camLook.set(0, 6, 0);
          shake += hit(12.66, 1.4, 8); chroma += hit(12.66, 0.03, 8); fl += hit(12.62, 0.8, 16);
        }
        camera.fov = fov; camera.updateProjectionMatrix();
        camera.position.set(camPos.x + Math.sin(t * 93) * shake * 0.9, camPos.y + Math.cos(t * 81) * shake * 0.9, camPos.z);
        camera.lookAt(camLook);
        camera.rotation.z += roll + Math.sin(t * 1.4) * 0.01 + Math.sin(t * 70) * shake * 0.015;
        camera.updateMatrixWorld();

        // S1 stamps ride with the camera
        R.forEach((w, i) => {
          const s = S1SHOTS.find((x) => x.stamp === i); const on = t >= s.a && t < s.b + (i === 2 ? 0.25 : 0) && t < T.S2;
          w.visible = on; if (!on) return;
          const D = [20, 26, 16][i];
          const fwv = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion), upv = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
          w.position.copy(camera.position).addScaledVector(fwv, D).addScaledVector(upv, [-0.26, 0.2, 0.22][i] * 0.432 * D * 1.77 - 0.35 * w.userData.s * 7.5);
          w.quaternion.copy(camera.quaternion);
          const k = seg(t, s.a, s.a + 0.16); w.scale.setScalar(w.userData.s * lerp(2.2, 1, E.outExpo(k)));
          w.rotateZ(lerp([-0.35, 0.3, -0.12][i], [-0.06, 0.05, 0][i], E.outExpo(k)));
        });

        canvas.style.filter = blur > 0.05 ? `blur(${blur.toFixed(2)}px)` : "none";
        fx.uniforms.amount.value = chroma;
        fx.uniforms.time.value = Math.floor(t * 60) / 60;
        if (t < T.S6) composer.render();

        // ===== HTML layers =====
        label.style.opacity = t < UNF ? "1" : (1 - seg(t, UNF, 3.3)).toFixed(3);
        playCap(CAP2, t, T.S3); $("#c2").style.opacity = t >= T.S2 && t < T.S3 - 0.12 ? "1" : "0";
        playCap(CAP3, t, T.S4); $("#c3").style.opacity = t >= T.S3 && t < 9.3 ? "1" : "0";
        playCap(CAP4, t, T.S5); $("#c4").style.opacity = t >= T.S4 && t < 11.75 ? "1" : "0";
        // "..." typing dots during the silence
        const dk = seg(t, 11.72, 11.9) * (1 - seg(t, 12.5, 12.62));
        dots.style.opacity = dk.toFixed(3);
        dots.style.transform = `scale(${lerp(0.6, 1, E.outBack(seg(t, 11.72, 11.95))).toFixed(3)})`;
        [...dots.children].forEach((d, i) => { d.style.transform = `translateY(${(-16 * Math.max(0, Math.sin((t - 11.7) * 9 - i * 0.9))).toFixed(1)}px)`; });

        // iris: green circle swallows the dark scene, then wipes up to reveal the site
        const ik = E.inCubic(seg(t, 13.36, T.S6));
        const up = E.inOutCubic(seg(t, T.S6, 13.9));
        iris.style.clipPath = `circle(${(ik * 1200).toFixed(0)}px at 540px 960px)`;
        iris.style.transform = `translateY(${(-up * 1920).toFixed(0)}px)`;
        iris.style.opacity = t >= 13.36 && t < 13.92 ? "1" : "0";

        // S6
        s6.style.opacity = t >= T.S6 && t < T.S7 + 0.05 ? "1" : "0";
        if (t >= T.S6 && t < T.S7 + 0.05) {
          playCap(CAP6, t, T.S7);
          const k = E.outCubic(seg(t, T.S6, 14.5));
          const out = E.inCubic(seg(t, 16.95, T.S7));
          $("#ph").style.transform = `translateY(${lerp(500, 0, k).toFixed(0)}px) rotateY(${lerp(-24, 0, k).toFixed(2)}deg) rotateX(${lerp(14, 0, k).toFixed(2)}deg) scale(${lerp(1, 3.2, out).toFixed(3)})`;
          $("#ph").style.transformOrigin = "620px 250px";
          const url = "refael-ai.com"; const n = Math.round(clamp((t - 13.86) / 1.0) * url.length);
          $("#url").textContent = url.slice(0, n);
          $("#car").style.opacity = t < 15.1 && Math.floor(t * 4) % 2 === 0 ? "1" : "0";
          $("#load").style.transform = `scaleX(${E.outCubic(seg(t, 14.9, 15.2)).toFixed(3)})`;
          $("#load").style.opacity = t >= 14.9 && t < 15.35 ? "1" : "0";
          const pg = seg(t, 15.05, 15.2);
          $("#page").style.opacity = pg.toFixed(3);
          $("#site").style.transform = `translateY(${(-E.inOutSine(seg(t, 15.4, 16.1)) * 420).toFixed(0)}px)`;
          const igk = seg(t, 16.12, 16.3);
          $("#ig").style.opacity = igk.toFixed(3); $("#bar").style.opacity = (1 - igk).toFixed(3);
          $("#ig").style.transform = `translateX(${lerp(-200, 0, E.outCubic(igk)).toFixed(0)}px)`;
          $("#lkhl").style.transform = `scaleX(${E.outExpo(seg(t, 16.55, 16.8)).toFixed(3)})`;
          const tp = seg(t, 16.5, 16.62) * (1 - seg(t, 16.8, 16.95));
          const tapEl = $("#tap"); tapEl.style.opacity = tp.toFixed(3); tapEl.style.left = TAP.x + "px"; tapEl.style.top = TAP.y + "px";
          tapEl.style.transform = `scale(${lerp(1.6, 1, E.outBack(seg(t, 16.5, 16.65))).toFixed(3)})`;
          $("#c6").style.opacity = t < 16.1 ? "1" : "0";
        }

        // S7
        s7.style.opacity = t >= T.S7 ? "1" : "0";
        if (t >= T.S7) {
          playCap(CAP7, t, T.END + 1);
          const k = seg(t, T.S7, 17.5);
          $("#disc").style.transform = `scale(${lerp(0.2, 1, E.outBack(k)).toFixed(3)})`;
          $("#ring").style.transform = `rotate(${(t * 12).toFixed(1)}deg) scale(${lerp(0.5, 1, E.outCubic(k)).toFixed(3)})`;
          $("#me").style.transform = `translateY(${lerp(700, 0, E.outCubic(seg(t, 17.2, 17.7))).toFixed(0)}px) scale(${(1 + 0.012 * Math.sin(t * 2)).toFixed(4)})`;
          $("#stk").style.transform = `rotate(-8deg) scale(${Math.max(0.001, E.outBack(seg(t, 17.85, 18.1))).toFixed(3)})`;
          ["#o1", "#o2", "#o3"].forEach((o, i) => {
            const kk = E.outBack(seg(t, 17.5 + i * 0.1, 17.8 + i * 0.1));
            $(o).style.transform = `scale(${Math.max(0.001, kk).toFixed(3)}) translateY(${(Math.sin(t * 2.2 + i * 2) * 14).toFixed(1)}px) rotate(${(Math.sin(t * 1.6 + i) * 8).toFixed(1)}deg)`;
          });
          const cb = E.outBack(seg(t, 19.2, 19.45));
          $("#cbox").style.transform = `translateY(${lerp(300, 0, cb).toFixed(0)}px) scale(${(1 + 0.06 * hit(20.0, 1, 8)).toFixed(3)})`;
          const typed = "אני"; const n = Math.round(clamp((t - 19.5) / 0.4) * typed.length);
          $("#cbt").textContent = typed.slice(0, n); $("#cph").style.display = n > 0 ? "none" : "inline";
        }
        // hearts burst on "send"
        document.querySelectorAll(".heart").forEach((h, i) => {
          const dt = t - 20.02 - i * 0.03; const on = dt > 0 && dt < 1.4;
          h.style.opacity = on ? (1 - seg(dt, 0.8, 1.4)).toFixed(3) : "0";
          const a = (i / 9) * Math.PI - Math.PI; const r = 280 * E.outCubic(seg(dt, 0, 0.9));
          h.style.transform = `translate(${(Math.cos(a) * r).toFixed(0)}px, ${(Math.sin(a) * r * 1.2 - dt * 60).toFixed(0)}px) scale(${lerp(0.3, 1, E.outBack(seg(dt, 0, 0.3))).toFixed(3)})`;
        });
        flash.style.opacity = clamp(fl).toFixed(3);
      }
      // hearts
      for (let i = 0; i < 10; i++) { const h = document.createElement("div"); h.className = "heart"; h.textContent = i % 3 ? "💚" : "🤍"; h.style.left = "460px"; h.style.top = "1580px"; s7.appendChild(h); }

      built.then(() => renderAt(window.__hfThreeTime || 0));
      window.addEventListener("hf-seek", (e) => { if (ready) renderAt(e.detail.time); else built.then(() => renderAt(e.detail.time)); });
    </script>
