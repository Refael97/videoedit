    <script type="module">
      import * as THREE from "three";
      import { Font } from "three/addons/loaders/FontLoader.js";
      import { TextGeometry } from "three/addons/geometries/TextGeometry.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
      import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";

      const W = 1080, H = 1920;
      const PAPER = 0xf8f6f3, INK = 0x141414, GREEN = 0x5cff2b;
      const font = new Font(JSON.parse(document.getElementById("fontjson").textContent));

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const lerp = (a, b, k) => a + (b - a) * k;
      const E = {
        lin: (x) => x,
        outCubic: (x) => 1 - Math.pow(1 - x, 3),
        inCubic: (x) => x * x * x,
        inOutCubic: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
        inOutSine: (x) => -(Math.cos(Math.PI * x) - 1) / 2,
        outExpo: (x) => (x === 1 ? 1 : 1 - Math.pow(2, -10 * x)),
        inQuad: (x) => x * x,
        outBack: (x) => { const c1 = 2.4, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
      };
      let seed = 2026;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      // ---------- renderer ----------
      const canvas = document.getElementById("gl");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(PAPER);
      scene.fog = new THREE.Fog(PAPER, 140, 430);
      const camera = new THREE.PerspectiveCamera(42, W / H, 0.5, 1500);

      scene.add(new THREE.HemisphereLight(0xffffff, 0xdcd4c6, 1.7));
      const sun = new THREE.DirectionalLight(0xffffff, 2.4);
      sun.position.set(-38, 80, 46); sun.target.position.set(0, 0, 0);
      sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
      Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 1, far: 260 });
      sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
      scene.add(sun, sun.target);

      // ---------- the graph-paper floor (the site's lab grid) ----------
      const gridTex = (() => {
        const c = document.createElement("canvas"); c.width = c.height = 1024; const g = c.getContext("2d");
        g.fillStyle = "#f8f6f3"; g.fillRect(0, 0, 1024, 1024);
        g.fillStyle = "rgba(17,17,17,0.13)";
        for (let i = 0; i < 8; i++) { g.fillRect(i * 128, 0, 5, 1024); g.fillRect(0, i * 128, 1024, 5); }
        const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(125, 125);
        t.anisotropy = renderer.capabilities.getMaxAnisotropy(); t.colorSpace = THREE.SRGBColorSpace; return t;
      })();
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshStandardMaterial({ map: gridTex, roughness: 0.92, metalness: 0 }));
      floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

      // ---------- extruded Rubik 900 (the site's headline face) ----------
      const matInk = [new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.3, metalness: 0.05 }), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.42 })];
      const matGreen = [new THREE.MeshStandardMaterial({ color: GREEN, emissive: 0x2a8a0c, emissiveIntensity: 0.35, roughness: 0.32 }), new THREE.MeshStandardMaterial({ color: 0x1f7d08, roughness: 0.4 })];
      const res = font.data.resolution;
      function makeWord(text, size, depth, matFor) {
        const g = new THREE.Group(); const glyphs = []; let x = 0;
        [...text].reverse().forEach((ch) => { // Hebrew: reverse logical order into left-to-right visual order
          const gd = font.data.glyphs[ch]; const adv = ((gd ? gd.ha : res * 0.28) / res) * size;
          if (ch !== " " && gd) {
            const geo = new TextGeometry(ch, { font, size, depth, curveSegments: 10, bevelEnabled: true, bevelThickness: size * 0.04, bevelSize: size * 0.025, bevelSegments: 4 });
            geo.computeBoundingBox(); const cx = (geo.boundingBox.min.x + geo.boundingBox.max.x) / 2;
            geo.translate(-cx, 0, -depth / 2);
            const m = new THREE.Mesh(geo, matFor(ch)); m.castShadow = true; m.receiveShadow = true;
            const h = new THREE.Group(); h.add(m); h.userData = { x: x + cx, ch }; glyphs.push(h); g.add(h);
          }
          x += adv * 1.0;
        });
        glyphs.forEach((h) => { h.position.x = h.userData.x - x / 2; h.userData.x = h.position.x; });
        g.userData = { glyphs, width: x }; return g;
      }
      const isPunct = (ch) => ch === "?" || ch === "!";
      // two rows so the vertical frame holds them: big "מה" behind, green "?!?!" in front
      const MA = makeWord("מה", 14, 5.5, () => matInk); MA.position.set(0, 0, -4); scene.add(MA);
      const PU = makeWord("?!?!", 8, 3.6, () => matGreen); PU.position.set(0, 0, 8); scene.add(PU);
      const letters = MA.userData.glyphs;
      const puncts = PU.userData.glyphs.slice().reverse(); // pop right-to-left: ? ! ? !

      // three "רגע." stamps, one per freeze shot
      const R = [0, 1, 2].map(() => { const w = makeWord("רגע.", 7.5, 3, () => matGreen); scene.add(w); return w; });

      // ---------- confetti: green / ink / white chips with shadows ----------
      const NC = 320;
      const chip = new THREE.BoxGeometry(1.1, 1.1, 0.14);
      const confetti = new THREE.InstancedMesh(chip, new THREE.MeshStandardMaterial({ roughness: 0.5 }), NC);
      confetti.castShadow = true; confetti.receiveShadow = true;
      const C0 = [];
      const cols = [new THREE.Color(GREEN), new THREE.Color(GREEN), new THREE.Color(INK), new THREE.Color(0xffffff)];
      for (let i = 0; i < NC; i++) {
        const a = rnd() * Math.PI * 2, sp = 18 + rnd() * 38, up = 22 + rnd() * 34;
        C0.push({ vx: Math.cos(a) * sp, vz: Math.sin(a) * sp * 0.8, vy: up, ox: (rnd() - 0.5) * 30, rx: rnd() * 9 - 4.5, ry: rnd() * 9 - 4.5, rz: rnd() * 9 - 4.5 });
        confetti.setColorAt(i, cols[i % 4]);
      }
      scene.add(confetti);
      const dummy = new THREE.Object3D();

      // ---------- post: chroma kick + grain ----------
      const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 }));
      composer.setPixelRatio(1); composer.setSize(W, H);
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new OutputPass());
      const fx = new ShaderPass({
        uniforms: { tDiffuse: { value: null }, amount: { value: 0 }, time: { value: 0 } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }",
        fragmentShader: `uniform sampler2D tDiffuse; uniform float amount; uniform float time; varying vec2 vUv;
          float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + time * 61.7) * 43758.5453); }
          void main(){ vec2 d = (vUv - 0.5) * amount;
            vec3 c = vec3(texture2D(tDiffuse, vUv + d).r, texture2D(tDiffuse, vUv).g, texture2D(tDiffuse, vUv - d).b);
            c *= mix(0.86, 1.0, smoothstep(1.0, 0.4, length((vUv - 0.5) * vec2(0.9, 1.0))));
            c += (hash(floor(vUv * vec2(1080.0, 1920.0))) - 0.5) * 0.035;
            gl_FragColor = vec4(c, 1.0); }`,
      });
      composer.addPass(fx);

      // ---------- shots ----------
      const T_IMP = 0.3, F1 = 1.38, F2 = 2.08, F3 = 2.82, UNF = 3.1;
      // simulation clock: runs, freezes on the first "רגע", resumes after the third
      const sim = (t) => (t < F1 ? t : t < UNF ? F1 : t - (UNF - F1));
      const v3 = (x, y, z) => new THREE.Vector3(x, y, z);
      const SHOTS = [
        { a: 0, b: 0.62, p0: v3(0, 50, 92), p1: v3(0, 44, 84), l0: v3(0, 10, 0), l1: v3(0, 10, 0), e: E.outCubic },
        { a: 0.62, b: F1, p0: v3(0, 44, 84), p1: v3(-38, 13, 66), l0: v3(0, 10, 0), l1: v3(2, 8, 0), e: E.inOutCubic },
        { a: F1, b: F2, p0: v3(44, 5, 50), p1: v3(40, 6.5, 55), l0: v3(-2, 7, 0), l1: v3(-2, 7, 0), e: E.inOutSine, stamp: 0 },
        { a: F2, b: F3, p0: v3(-6, 76, 40), p1: v3(-2, 80, 44), l0: v3(0, 0, 3), l1: v3(0, 0, 3), e: E.inOutSine, stamp: 1 },
        { a: F3, b: UNF, p0: v3(22, 14, 36), p1: v3(19, 14.5, 39), l0: v3(-2, 7, -2), l1: v3(-2, 7, -2), e: E.inOutSine, stamp: 2 },
        { a: UNF, b: 3.6, p0: v3(19, 14.5, 39), p1: v3(6, 120, 70), l0: v3(-2, 7, -2), l1: v3(0, 150, -160), e: E.inCubic },
      ];
      const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), fwd = new THREE.Vector3();
      // place each stamp in front of its shot's camera, facing it
      SHOTS.forEach((s) => {
        if (s.stamp === undefined) return;
        const w = R[s.stamp]; const dir = s.l0.clone().sub(s.p0).normalize();
        // sized so the stamp spans ~70% of the frame width at its distance
        const D = [20, 26, 16][s.stamp]; const fit = (0.7 * 0.432 * D) / R[s.stamp].userData.width;
        w.position.copy(s.p0).addScaledVector(dir, D);
        w.lookAt(s.p0); w.userData.base = w.quaternion.clone();
        const up = new THREE.Vector3(0, 1, 0).applyQuaternion(w.quaternion); const sideDrop = [-0.26, 0.2, 0.22][s.stamp] * 0.432 * D * 1.77;
        w.position.addScaledVector(up, sideDrop - 0.35 * fit * 7.5);
        w.scale.setScalar(fit); w.userData.s = fit;
      });

      const flash = document.getElementById("flash"), pause = document.getElementById("pause"), label = document.getElementById("label");
      function renderAt(t) {
        const st = sim(t);
        // falling letters
        letters.forEach((g, i) => {
          const s = 0.06 + i * 0.03, e = T_IMP - 0.02 + i * 0.02; const k = seg(st, s, e);
          g.visible = st >= s; g.position.y = lerp(95, 0, E.inQuad(k));
          g.rotation.z = lerp(i ? 0.6 : -0.5, 0, E.inQuad(k));
          const sq = st > e ? 1 - 0.2 * Math.exp(-(st - e) * 13) * Math.cos((st - e) * 34) : 1;
          g.scale.set(2 - sq, sq, 1); // squash-stretch on landing
        });
        // punctuation pops up out of the paper
        puncts.forEach((g, i) => {
          const s = 0.38 + i * 0.08; const k = seg(st, s, s + 0.3);
          g.visible = st >= s; const sc = E.outBack(k); g.scale.setScalar(Math.max(0.001, sc));
          g.position.y = Math.sin(Math.PI * clamp(k * 1.4)) * 7;
          g.rotation.y = (1 - E.outCubic(k)) * 3.2;
        });
        // confetti from the impact point, frozen with the sim clock
        const ct = st - T_IMP;
        confetti.visible = ct > 0;
        for (let i = 0; i < NC; i++) {
          const c = C0[i]; const dt = Math.max(0, ct); const drag = (1 - Math.exp(-dt * 1.6)) / 1.6;
          let y = 2 + c.vy * drag - 30 * dt * dt; const landed = y < 0.08; if (landed) y = 0.08;
          dummy.position.set(c.ox + c.vx * drag, y, 1 + c.vz * drag);
          dummy.rotation.set(landed ? -Math.PI / 2 : c.rx * dt, landed ? 0 : c.ry * dt, c.rz * dt);
          dummy.scale.setScalar(ct > 0 ? 1 : 0.001); dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix);
        }
        confetti.instanceMatrix.needsUpdate = true;

        // camera
        const sh = SHOTS.find((s) => t >= s.a && t < s.b) || SHOTS[SHOTS.length - 1];
        const k = sh.e(seg(t, sh.a, sh.b));
        camPos.lerpVectors(sh.p0, sh.p1, k); camLook.lerpVectors(sh.l0, sh.l1, k);
        let shake = Math.exp(-Math.max(0, t - T_IMP) * 9) * (t > T_IMP ? 1 : 0);
        [F1, F2, F3].forEach((f) => { if (t >= f) shake += 0.8 * Math.exp(-(t - f) * 14); });
        camera.position.set(camPos.x + Math.sin(t * 93) * shake * 0.9, camPos.y + Math.cos(t * 81) * shake * 0.9, camPos.z);
        camera.lookAt(camLook);
        camera.rotation.z += Math.sin(t * 1.4) * 0.01 + Math.sin(t * 70) * shake * 0.015;
        camera.updateProjectionMatrix();
        camera.updateMatrixWorld();

        // stamps: each "רגע." slams in on its cut, rides with the camera (lit, in 3D) and stays only in its own shot
        R.forEach((w, i) => {
          const s = SHOTS.find((x) => x.stamp === i); const on = t >= s.a && t < s.b + (i === 2 ? 0.25 : 0);
          w.visible = on; if (!on) return;
          const D = [20, 26, 16][i];
          const fw = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
          const upv = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
          w.position.copy(camera.position).addScaledVector(fw, D).addScaledVector(upv, [-0.26, 0.2, 0.22][i] * 0.432 * D * 1.77 - 0.35 * w.userData.s * 7.5);
          w.quaternion.copy(camera.quaternion);
          const k = seg(t, s.a, s.a + 0.16); w.scale.setScalar(w.userData.s * lerp(2.2, 1, E.outExpo(k)));
          w.rotateZ(lerp([-0.35, 0.3, -0.12][i], [-0.06, 0.05, 0][i], E.outExpo(k)));
        });

        const whip = Math.pow(seg(t, UNF, 3.6), 2);
        canvas.style.filter = `blur(${(whip * 9).toFixed(2)}px)`;
        let ch = 0; [F1, F2, F3].forEach((f) => { if (t >= f) ch += Math.exp(-(t - f) * 16); });
        fx.uniforms.amount.value = 0.002 + ch * 0.02 + 0.02 * Math.exp(-Math.max(0, t - T_IMP) * 10) * (t > T_IMP ? 1 : 0) + whip * 0.02;
        fx.uniforms.time.value = Math.floor(t * 60) / 60;
        let fl = 0; [F1, F2, F3].forEach((f) => { if (t >= f) fl += 0.6 * Math.exp(-(t - f) * 22); });
        flash.style.opacity = fl.toFixed(3);
        pause.style.opacity = t >= F1 && t < UNF ? "1" : "0";
        pause.style.transform = `scale(${t >= F1 && t < UNF ? (1 + 0.18 * Math.exp(-(t - [F1, F2, F3].filter((f) => t >= f).pop()) * 12)).toFixed(3) : 1})`;
        label.style.opacity = t < UNF ? "1" : (1 - seg(t, UNF, 3.3)).toFixed(3);
        composer.render();
      }
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
