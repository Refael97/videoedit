      import * as THREE from "three";

      const font = new Font(JSON.parse(document.getElementById("fontjson").textContent));

      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

        { const ph = $("#ph"), lk = $("#ig .lk"); let x = 0, y = 0, el = lk; while (el && el !== ph) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } TAP.x = x + lk.offsetWidth / 2; TAP.y = y + lk.offsetHeight / 2; }

      const built = build(); window.__hf.buildReady["promo-scene"] = built;

      // ---------- camera helpers ----------

      }
      const add = (o, x, y, z) => v3(o.x + x, o.y + y, o.z + z);
      const S2SHOTS = [
        { a: T.S2, b: 4.1, p0: add(X2, 4, 120, 90), p1: add(X2, 0, 30, 76), l0: add(X2, 0, 40, -40), l1: add(X2, 0, 8, 0), e: E.outCubic },

        { a: 5.25, b: 5.8, p0: add(X2, 24, 22, 68), p1: add(X2, 8, 30, 66), l0: add(X2, 0, 7, 0), l1: add(X2, 0, 3, 8), e: E.inOutCubic },

      const S3SHOTS = [
        { a: T.S3, b: 7.9, p0: add(X3, -14, 20, 92), p1: add(X3, -3, 10, 84), l0: add(X3, 2, 6, 0), l1: add(X3, 2, 6, 0), e: E.outCubic },
        { a: 7.9, b: 8.72, p0: add(X3, -3, 10, 84), p1: add(X3, 4, 8, 78), l0: add(X3, 2, 6, 0), l1: add(X3, 3, 6, 0), e: E.inOutSine },

        { a: 9.25, b: T.S4, p0: add(X3, 3, 13, 90), p1: add(X3, 6.5, 5.3, 6), l0: add(X3, 3, 7, 0), l1: add(X3, 6.5, 5.1, 0), e: E.inExpo },

      const flash = $("#flash"), pause = $("#pause"), label = $("#label"), dots = $("#dots"), iris = $("#iris");
      const s6 = $("#s6"), s7 = $("#s7");
      function renderAt(t) {
        if (!ready) return;
        let shake = 0, chroma = 0.002, blur = 0, fl = 0, fov = 42, roll = 0;
        const hit = (ti, a = 1, r = 12) => (t >= ti ? a * Math.exp(-(t - ti) * r) : 0);

          const sq = st > e ? 1 - 0.2 * Math.exp(-(st - e) * 13) * Math.cos((st - e) * 34) : 1; g.scale.set(2 - sq, sq, 1);
        });
        puncts.forEach((g, i) => {
          const s = 0.38 + i * 0.08; const k = seg(st, s, s + 0.3);
          g.visible = st >= s; g.scale.setScalar(Math.max(0.001, E.outBack(k)));

        cardMeshes.forEach((m, i) => {
          const tin = 3.9 + i * 0.12; const k = E.outBack(seg(t, tin, tin + 0.35));

          const from = v3(Math.sin(ang) * 120, 40 + i * 6, Math.cos(ang) * 90);

        const cr = E.outBack(seg(t, 5.2, 5.5)); crate.visible = t >= 5.2; crate.position.y = lerp(-14, 0, cr);
        const lidK = seg(t, 5.6, 5.76); lidPivot.rotation.x = lerp(-1.95, 0, E.inQuad(lidK));

        shek.visible = t >= 8.7; shek.scale.setScalar(Math.max(0.001, E.outBack(seg(t, 8.72, 8.95)))); shek.rotation.y = (1 - E.outCubic(seg(t, 8.72, 9.1))) * 6;
        bang.visible = t >= 8.86; bang.position.y = lerp(60, 17.5, E.inQuad(seg(t, 8.86, 9.02)));

        alarm.position.set(X3.x + Math.sin(t * 9) * 18, 12, 14); alarm.intensity = inS3 && t > 8.7 ? 900 * (0.6 + 0.4 * Math.sin(t * 24)) : 0;

        // --- S4 ---
        if (emo) { emo.rotation.y = Math.sin(t * 1.1) * 0.12; const sc = 1 + 0.04 * Math.sin(t * 10) * seg(t, 11.66, 12.6); emo.scale.setScalar(sc); }

          const j = AF.userData.glyphs.length - 1 - i; const s = 12.62 + j * 0.03; const k = seg(t, s, s + 0.16);
          g.visible = t >= s; g.position.z = lerp(110, 0, E.outExpo(k)); g.rotation.x = lerp(-1.2, 0, E.outExpo(k));
          const e = s + 0.16; const sq = t > e ? 1 + 0.25 * Math.exp(-(t - e) * 12) * Math.sin((t - e) * 36) : 1; g.scale.set(1, sq, 1);
        });
        stepConfetti(conf5, v3(0, 2, 0), darkMode ? t - 12.7 : -1, 0.05, 1.1);

        // ===== camera per scene =====
        if (t < T.S2) {
          placeSun(v3(0, 0, 0));
          const sh = fromShots(S1SHOTS, t);
          shake += hit(T_IMP, 1, 9); [F1, F2, F3].forEach((f) => { shake += hit(f, 0.8, 14); chroma += hit(f, 0.02, 16); fl += hit(f, 0.6, 22); });
          chroma += hit(T_IMP, 0.02, 10);
          blur = Math.pow(seg(t, UNF, T.S2), 2) * 9;
          pause.style.opacity = t >= F1 && t < UNF ? "1" : "0";
          const lastF = [F1, F2, F3].filter((f) => t >= f).pop();

        } else if (t < T.S4) {

          shake += hit(8.74, 1.0, 9) + hit(9.0, 0.7, 10); chroma += hit(8.74, 0.025, 9);

          tapEl.style.transform = `scale(${lerp(1.6, 1, E.outBack(seg(t, 16.5, 16.65))).toFixed(3)})`;

          $("#me").style.transform = `translateY(${lerp(700, 0, E.outCubic(seg(t, 17.2, 17.7))).toFixed(0)}px) scale(${(1 + 0.012 * Math.sin(t * 2)).toFixed(4)})`;
          $("#stk").style.transform = `rotate(-8deg) scale(${Math.max(0.001, E.outBack(seg(t, 17.85, 18.1))).toFixed(3)})`;
          ["#o1", "#o2", "#o3"].forEach((o, i) => {
            const kk = E.outBack(seg(t, 17.5 + i * 0.1, 17.8 + i * 0.1));

          h.style.opacity = on ? (1 - seg(dt, 0.8, 1.4)).toFixed(3) : "0";
