      #gHalo { filter: blur(14px); opacity: 0.38; }

      .sH { fill: none; stroke: #c4633f; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
      .sT { fill: none; stroke: var(--tube); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .sC { fill: none; stroke: #fff1e6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .head { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; }

      #ilogo { position: absolute; left: 810px; top: 390px; width: 300px; height: 300px; }

    <script>
      // the film runs on `tl`, whose clock is the narration's (tl 0 = VO 0); `master` adds the 1s opener in front
      const tl = gsap.timeline();
      const IR = { immediateRender: false };
      const $ = (s) => document.querySelector(s);
      const $$ = (s) => Array.from(document.querySelectorAll(s));
      const ft = (sel, from, to, at) => { tl.set(sel, from, 0); tl.fromTo(sel, from, { ...to, ...IR }, at); };
      const N = 7, PW = 1920;
      const X = (p, x) => (N - 1 - p) * PW + x; // panel-local x -> world x (panels run right-to-left)
      $$(".pn").forEach((el, i) => { el.style.left = X(i, 0) + "px"; });
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      // the mark: an irregular hand-cut starburst, drawn here (not the official logo file)
      const RAYS = [[0, 45], [31, 37], [58, 43], [92, 35], [119, 45], [152, 38], [178, 44], [211, 36], [240, 45], [268, 37], [301, 43], [329, 36]];
      $$("svg.spark").forEach((s) => {
        s.innerHTML = RAYS.map(([a, r]) => { const t = (a * Math.PI) / 180; return '<line x1="' + (9 * Math.cos(t)).toFixed(2) + '" y1="' + (9 * Math.sin(t)).toFixed(2) + '" x2="' + (r * Math.cos(t)).toFixed(2) + '" y2="' + (r * Math.sin(t)).toFixed(2) + '" stroke="#d97757" stroke-width="8.5" stroke-linecap="round" />'; }).join("");
      });

      // ---------- camera ----------
      const camAt = (p) => -X(p, 0);
      const PANS = [[1, 2.12], [2, 6.74]];
      tl.set("#world", { x: camAt(0) }, 0);
      PANS.forEach(([b, t]) => tl.to("#world", { x: camAt(b), duration: 0.5, ease: "power3.inOut" }, t));
      const beats = [0, ...PANS.map((p) => p[1]), 8.6];
      beats.slice(0, -1).forEach((a, i) => tl.fromTo("#cam", { scale: 1.0 }, { scale: 1.03, duration: beats[i + 1] - a, ease: "none", ...IR }, a));
      tl.set("#cam", { scale: 1 }, 0);
      // step counter in the grid
      ["00 / 06 — HOOK", "01 / 06 — THE MODEL", "02 / 06 — CODE"].forEach((t, i) => {
        const s = document.createElement("span"); s.textContent = t; $("#cnt").appendChild(s);
        tl.set(s, { opacity: i === 0 ? 1 : 0 }, 0);
        if (i > 0) { tl.set(s, { opacity: 1 }, PANS[i - 1][1] + 0.25); tl.set($("#cnt").children[i - 1], { opacity: 0 }, PANS[i - 1][1] + 0.25); }
      });

      // ---------- the line: curves only; every spark fades where its piece stops ----------
      const NS = "http://www.w3.org/2000/svg";
      const P = (p, pts) => pts.replace(/(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/g, (m, x, y) => X(p, +x) + "," + y);
      const piece = (d, a, b, o = {}) => {
        const mk = (g, cls) => { const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); q.setAttribute("class", cls); $(g).appendChild(q); return q; };
        const ps = [mk("#gHalo", "sH"), mk("#gTube", "sT"), mk("#gCore", "sC")], p = ps[1], L = p.getTotalLength(), dur = b - a, ease = o.ease || "sine.inOut";
        ft(ps, { strokeDasharray: L + " " + L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: dur, ease }, a);
        if (!o.noHead) {
          const h = document.createElement("div"); h.className = "head"; h.innerHTML = "<b></b><i></i>"; $("#world").appendChild(h);
          const e = gsap.parseEase(ease), n = Math.max(8, Math.round(dur * 30)), kf = [];
          for (let i = 1; i <= n; i++) { const pt = p.getPointAtLength(L * e(i / n)), q = p.getPointAtLength(Math.min(L, L * e(i / n) + 3)); kf.push({ x: pt.x, y: pt.y, rotation: (Math.atan2(q.y - pt.y, q.x - pt.x) * 180) / Math.PI, duration: dur / n }); }
          const p0 = p.getPointAtLength(0);
          tl.set(h, { x: p0.x, y: p0.y, opacity: 0, scale: 1 }, 0);
          tl.set(h, { opacity: 1 }, a);
          tl.to(h, { keyframes: kf, ease: "none" }, a);
          if (o.hold != null) tl.set(h, { opacity: 0 }, o.hold);
          else if (o.chain) tl.set(h, { opacity: 0 }, b);
          else tl.to(h, { opacity: 0, scale: 0.3, duration: 0.25, ease: "power2.in" }, b);
        }
        return p;
      };
      const frameLayers = (pn, d, a, out) => {
        const svg = document.createElementNS(NS, "svg"); svg.setAttribute("class", "nf"); svg.setAttribute("viewBox", "0 0 1920 1080"); $(pn).appendChild(svg);
        [["rgba(196,99,63,0.5)", 14, "blur(8px)"], ["#e8835f", 4.5, "drop-shadow(0 0 5px rgba(232,131,95,0.75))"], ["#fff1e6", 1.6, "none"]].forEach(([c, w2, f]) => {
          const q = document.createElementNS(NS, "path"); q.setAttribute("d", d); q.setAttribute("fill", "none"); q.setAttribute("stroke", c); q.setAttribute("stroke-width", w2); q.setAttribute("stroke-linecap", "round"); q.style.filter = f; svg.appendChild(q);
          const L = q.getTotalLength();
          ft(q, { strokeDasharray: L + " " + L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.inOut" }, a);
        });
        tl.set(svg, { opacity: 1 }, 0);
        if (out != null) tl.to(svg, { opacity: 0, duration: 0.2 }, out);
        return svg;
      };
      const rectD = (x, y, w, h, r) => "M" + (x + w / 2) + "," + (y + h) + " L" + (x + r) + "," + (y + h) + " Q" + x + "," + (y + h) + " " + x + "," + (y + h - r) + " L" + x + "," + (y + r) + " Q" + x + "," + y + " " + (x + r) + "," + y + " L" + (x + w - r) + "," + y + " Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + " L" + (x + w) + "," + (y + h - r) + " Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) + " Z";
      // full rounded loop around the window (drawn at 150,150, 582x784), 14px outside, starting and closing on its right edge
      const LOOP = "M746,800 L746,190 Q746,136 692,136 L190,136 Q136,136 136,190 L136,894 Q136,948 190,948 L692,948 Q746,948 746,894 L746,800";

      // P0: travels low under the hook and out to the left
      piece(P(0, "M1990,1000 C1500,1004 700,990 0,995"), 0.0, 2.12, { ease: "sine.inOut", chain: true });
      // P1: in low, up the window's right edge, a closed loop; later out of the bottom
      piece(P(1, "M1920,995 C1300,1000 746,1010 746,800"), 2.12, 2.6, { ease: "sine.inOut", chain: true });
      piece(P(1, LOOP), 2.6, 3.5, { ease: "none" });
      frameLayers("#P1", rectD(790, 382, 420, 108, 36), 4.6, 5.46);
      piece(P(1, "M460,948 C370,948 340,1035 220,1035 L0,1035"), 6.25, 6.82, { ease: "sine.in", chain: true });
      tl.fromTo(".head b", { scale: 0.85 }, { scale: 1.15, duration: 0.18, yoyo: true, repeat: 120, ease: "sine.inOut", ...IR }, 0);

      // ---------- dust ----------
      const dl = $("#dustL");
      for (let i = 0; i < 40; i++) {
        const d = document.createElement("div"); d.className = "dust";
        d.style.cssText = "left:" + (rnd() * 1920).toFixed(0) + "px;top:" + (rnd() * 1080).toFixed(0) + "px;opacity:" + (0.08 + rnd() * 0.26).toFixed(2) + ";transform:scale(" + (0.5 + rnd() * 1.3).toFixed(2) + ")";
        dl.appendChild(d);
        tl.fromTo(d, { x: 0, y: 0 }, { x: 60 + rnd() * 120, y: -30 - rnd() * 60, duration: 19.5, ease: "none", ...IR }, 0);
      }
      tl.set("#dustL", { opacity: 1 }, 0);

      // ---------- headlines ----------
      const words = (sel) => {
        const el = $(sel);
        Array.from(el.childNodes).forEach((n) => {
          if (n.nodeType === 3) {
            const f = document.createDocumentFragment();
            n.textContent.split(/(\s+)/).forEach((t) => { if (!t) return; if (/^\s+$/.test(t)) { f.appendChild(document.createTextNode(" ")); return; } const sp = document.createElement("span"); sp.className = "w"; sp.textContent = t; f.appendChild(sp); });
            n.replaceWith(f);
          } else if (n.nodeName === "EM" || n.nodeName === "SPAN" || n.nodeName === "SMALL") n.classList.add("w");
        });
        return $$(sel + " > .w");
      };
      const headline = (sel, a, b, stg = 0.07) => {
        const ws = words(sel);
        ft(ws, { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: stg }, a);
        if (b != null) tl.to(ws, { opacity: 0, y: -36, filter: "blur(12px)", duration: 0.2, ease: "power2.in", stagger: 0.02 }, b - 0.22);
      };
      const cardIn = (sel, at) => {
        ft(sel, { opacity: 0, rotationY: 28, z: -260 }, { opacity: 1, rotationY: -10, z: 0, duration: 0.9, ease: "expo.out" }, at);
        tl.to(sel, { rotationY: -4, rotationX: 2, duration: 3.4, ease: "sine.inOut" }, at + 0.9);
      };
      const tap = (sel, at) => ft(sel, { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1, opacity: 1, duration: 0.12 }, { scale: 1.7, opacity: 0, duration: 0.42 }] }, at);

      // P0 hook: every word lands on its spoken time
      const t0w = $$("#t0 .w");
      [0.1, 0.5, 0.82].forEach((t, i) => ft(t0w[i], { opacity: 0, scale: 1.35, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t));
      [1.44, 1.64].forEach((t, i) => ft(t0w[3 + i], { opacity: 0, scale: 1.5, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "back.out(1.6)" }, t));

      // P1 the model: Fable 5.2 is picked in the window, pops out, and the plans it is open to follow
      cardIn("#w1", 2.2);
      headline("#h1", 2.24, 4.0, 0.14);
      headline("#h2", 4.0, 5.44);
      headline("#h3", 5.44, null, 0.3);
      tl.set(["#rBg", "#rCk"], { opacity: 0 }, 0);
      tl.set("#pillNew", { opacity: 0, y: 30 }, 0);
      ft("#popRow", { opacity: 0, scale: 1.232, x: -559, y: 144 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 4.3);
      tap("#tap1", 4.76);
      tl.to("#popRow", { scale: 0.94, duration: 0.07, yoyo: true, repeat: 1 }, 4.76);
      tl.to("#rBg", { opacity: 1, duration: 0.2 }, 4.8);
      ft("#rCk", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(3)" }, 4.82);
      tl.to("#pillOld", { opacity: 0, y: -30, duration: 0.25, ease: "power2.in" }, 4.8);
      tl.to("#pillNew", { opacity: 1, y: 0, duration: 0.35, ease: "back.out(1.6)" }, 4.98);
      ["Pro", "Max", "Ultra", "Team", "Enterprise"].forEach((t, i) => {
        const c = document.createElement("div"); c.className = "chip aa"; c.textContent = t; $("#chips").appendChild(c);
        ft(c, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.4)" }, 5.5 + i * 0.1);
      });

      // master: 1s opener, then the film on the narration clock
      const master = gsap.timeline({ paused: true });
      master.set("#ilogo", { scale: 0, opacity: 0, rotation: -40 }, 0);
      master.to("#ilogo", { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, 0.08);
      master.to("#ilogo", { scale: 1.06, rotation: 8, duration: 0.25, ease: "sine.inOut" }, 0.5);
      master.to("#ilogo", { scale: 0, opacity: 0, rotation: 40, duration: 0.22, ease: "back.in(2)" }, 0.76);
      tl.seek(0.001, false);
      master.add(tl, 1.0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = master;
    </script>
  </body>
</html>
