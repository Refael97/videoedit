      /* one art direction: pale studio, black lacquer + white ceramic + chrome, ONE clay accent */
      :root { --ink: #141413; --muted: #6c685f; --c: #c95b34; --paper: #efede8; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #e2e1e3; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Heebo", sans-serif; color: var(--ink); }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      #ov { position: absolute; inset: 0; direction: rtl; pointer-events: none; }
      .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

      /* editorial grid, fixed on the lens (kept inside the story safe area) */
      #grid { position: absolute; left: 84px; right: 84px; top: 262px; height: 30px; direction: ltr; font: 500 25px "Mono", monospace; letter-spacing: 4px; color: var(--muted); text-transform: uppercase; }
      #grid b { color: var(--c); font-weight: 700; }
      #grid .l { position: absolute; left: 0; top: 0; }
      #grid .r { position: absolute; right: 0; top: 0; }
      #grid .ln { position: absolute; left: 0; right: 0; top: 46px; height: 1.5px; background: rgba(20, 20, 19, 0.16); transform-origin: 0 50%; }
      .br { position: absolute; width: 26px; height: 26px; border: 0 solid rgba(20, 20, 19, 0.34); }
      .br.a { left: 48px; top: 210px; border-left-width: 2px; border-top-width: 2px; }
      .br.b { right: 48px; top: 210px; border-right-width: 2px; border-top-width: 2px; }
      .br.c { left: 48px; bottom: 300px; border-left-width: 2px; border-bottom-width: 2px; }
      .br.d { right: 48px; bottom: 300px; border-right-width: 2px; border-bottom-width: 2px; }

      .blk { position: absolute; left: 84px; right: 84px; top: 348px; text-align: right; }
      .eye { direction: ltr; text-align: right; font: 500 27px "Mono", monospace; letter-spacing: 5px; color: var(--muted); margin-bottom: 18px; }
      .eye b { color: var(--c); font-weight: 700; }
      .ttl { font-weight: 900; font-size: 128px; line-height: 1.13; }
      .ttl .ln2 { display: block; }
      .ttl .w { display: inline-block; }
      .ttl em { font-style: normal; color: var(--c); }
      .sub { margin-top: 26px; font-size: 40px; font-weight: 500; line-height: 1.3; color: #4b4842; }
      .sub.mono { direction: ltr; text-align: right; font: 500 28px "Mono", monospace; letter-spacing: 3px; color: var(--muted); }
      .sub.mono b { color: var(--c); font-weight: 700; }

      #end { position: absolute; inset: 0; background: var(--paper); direction: ltr; text-align: center; }
      #eMark { position: absolute; left: 430px; top: 560px; width: 220px; height: 220px; }
      #eClaude { position: absolute; left: 0; right: 0; top: 828px; font: 500 58px "Heebo", sans-serif; letter-spacing: 1px; color: #57534b; }
      #eName { position: absolute; left: 0; right: 0; top: 890px; font-weight: 900; font-size: 190px; line-height: 1.1; color: var(--ink); }
      #eName em { font-style: normal; color: var(--c); }
      #eName span, #eName em { display: inline-block; }
      #eRule { position: absolute; left: 390px; top: 1136px; width: 300px; height: 2px; background: rgba(20, 20, 19, 0.3); }
      #eTag { position: absolute; left: 0; right: 0; top: 1168px; direction: rtl; font-size: 46px; font-weight: 700; color: #3a3833; }
      #eCred { position: absolute; left: 0; right: 0; top: 1392px; }
      #eCred small { display: block; font: 500 22px "Mono", monospace; letter-spacing: 7px; color: var(--muted); }
      #eCred b { display: block; margin-top: 12px; font-size: 54px; font-weight: 700; color: var(--ink); }
      #eCred i { display: block; margin-top: 8px; font: 500 26px "Mono", monospace; font-style: normal; letter-spacing: 2px; color: var(--c); }
    </style>

  <body>

    <script>
      // type overlay: a paused timeline on film time, seeked by the 3D renderer on every frame
      const O = 0.8, v = (s) => s + O;
      const ov = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s), $$ = (s) => Array.from(document.querySelectorAll(s));
      // word = [text, narration time, accent?, ltr?] ; a line may carry its own size
      const BLOCKS = [
        { out: 2.02, eye: ["<b>NEW MODEL</b> · 09.11.2026", 0.0], lines: [[["חיכיתם", 0.12]], [["למודל", 0.52], ["הבא?", 0.84]], [["הוא", 1.46, 1], ["כאן.", 1.66, 1]]] },
        { out: 6.5, eye: ["<b>01</b> — THE MODEL", 2.5], lines: [{ size: 172, ltr: 1, w: [["Fable", 2.26], ["5.2", 2.64, 1]] }, { size: 104, w: [["המודל", 4.02], ["הכי", 4.34], ["חזק", 4.74, 1]] }, { size: 70, w: [["של", 5.02], ["Claude,", 5.18, 0, 1], ["פתוח", 5.46], ["לכולם.", 5.94]] }], sub: ["PRO · MAX · ULTRA · TEAM · ENTERPRISE", 6.02, 1] },
        { out: 8.22, eye: ["<b>02</b> — CODE", 6.95], lines: [[["כותב", 6.94], ["קוד", 7.28]], [["ברמה", 7.46], ["חדשה.", 7.86, 1]]], sub: ["FRONTIERCODE 2.0 · AGENTIC CODING", 7.5, 1] },
        { out: 10.32, eye: ["<b>03</b> — AGENTS", 8.7], lines: [[["יותר", 8.8], ['מ‑<span class="ltr" id="n1000">1</span>', 9.08, 1]], [["סוכנים", 9.56], ["במקביל.", 9.88]]], sub: ["סוכן מוביל אחד מתאם את כולם.", 9.95] },
        { out: 12.62, eye: ["<b>04</b> — LONG RUNS", 10.8], lines: [[["משימה", 10.96], ["אחת.", 11.38]], [["ימים", 11.76, 1], ["שלמים.", 12.14, 1]]], sub: ["בניסוי אחד: שמונה ימים רצופים.", 12.05] },
        { out: 15.36, eye: ["<b>05</b> — SPEED · PRICE", 13.0], lines: [[["מהיר", 12.96], ["עד", 13.24], ["30%", 13.38, 1, 1]], { size: 92, w: [["ובמחיר", 14.2], ["נמוך", 14.64, 1], ["יותר.", 14.94]] }], sub: ["<b>$8 / $40</b> PER 1M TOKENS · WAS $10 / $50", 14.75, 1] },
        { out: 17.5, lines: [{ size: 112, w: [["בקיצור,", 15.6]] }, { size: 112, w: [["העתיד", 16.38], ["כבר", 16.84, 1], ["כאן.", 17.1, 1]] }] },
      ];
      BLOCKS.forEach((b) => {
        const el = document.createElement("div"); el.className = "blk"; let h = "";
        if (b.eye) h += '<div class="eye" data-t="' + b.eye[1] + '">' + b.eye[0] + "</div>";
        h += '<div class="ttl">' + b.lines.map((l) => { const ws = l.w || l; return '<span class="ln2' + (l.ltr ? " ltr" : "") + '"' + (l.size ? ' style="font-size:' + l.size + 'px' + (l.ltr ? ";display:block;text-align:right" : "") + '"' : "") + ">" + ws.map(([t, at, em, ltr]) => "<" + (em ? "em" : "span") + ' class="w' + (ltr ? " ltr" : "") + '" data-t="' + at + '">' + t + "</" + (em ? "em" : "span") + ">").join(" ") + "</span>"; }).join("") + "</div>";
        if (b.sub) h += '<div class="sub' + (b.sub[2] ? " mono" : "") + '" data-t="' + b.sub[1] + '">' + b.sub[0] + "</div>";
        el.innerHTML = h; $("#blocks").appendChild(el);
        Array.from(el.querySelectorAll("[data-t]")).forEach((n) => {
          const at = v(+n.dataset.t), big = n.classList.contains("w");
          ov.set(n, { opacity: 0 }, 0);
          ov.fromTo(n, { opacity: 0, y: big ? 46 : 16, filter: big ? "blur(12px)" : "blur(0px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: big ? 0.55 : 0.5, ease: "expo.out", immediateRender: false }, at);
          ov.to(n, { opacity: 0, y: -22, duration: 0.24, ease: "power2.in" }, v(b.out));
        });
      });
      // grid draws in once, then stays
      ov.fromTo("#grid .ln", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 0.1);
      ov.fromTo(["#grid .l", "#grid .r", ".br"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.15);
      // end card
      const RAYS = [[0, 45], [31, 37], [58, 43], [92, 35], [119, 45], [152, 38], [178, 44], [211, 36], [240, 45], [268, 37], [301, 43], [329, 36]];
      $("#eMark").innerHTML = RAYS.map(([a, r]) => { const q = (a * Math.PI) / 180; return '<line x1="' + (9 * Math.cos(q)).toFixed(2) + '" y1="' + (9 * Math.sin(q)).toFixed(2) + '" x2="' + (r * Math.cos(q)).toFixed(2) + '" y2="' + (r * Math.sin(q)).toFixed(2) + '" stroke="#c95b34" stroke-width="8.5" stroke-linecap="round" />'; }).join("");
      ov.set("#end", { opacity: 0 }, 0);
      ov.to("#end", { opacity: 1, duration: 0.55, ease: "power2.inOut" }, v(17.4));
      ov.to(["#grid", ".br"], { opacity: 0, duration: 0.3 }, v(17.4));
      ov.fromTo("#eMark", { scale: 0, rotation: -120, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: "expo.out" }, v(17.62));
      ov.to("#eMark", { rotation: 24, duration: 4.2, ease: "none" }, v(18.42));
      ov.fromTo("#eClaude", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, v(17.7));
      ov.fromTo("#eName span", { opacity: 0, y: 50, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, v(17.78));
      ov.fromTo("#eName em", { opacity: 0, scale: 1.4, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, v(18.24));
      ov.fromTo("#eRule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, v(18.7));
      ov.fromTo("#eTag", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, v(18.85));
      ov.fromTo("#eCred small", { opacity: 0, letterSpacing: "14px" }, { opacity: 1, letterSpacing: "7px", duration: 0.7, ease: "expo.out" }, v(19.7));
      ov.fromTo("#eCred b", { opacity: 0, y: 24, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, v(19.85));
      ov.fromTo("#eCred i", { opacity: 0 }, { opacity: 1, duration: 0.5 }, v(20.15));
      ov.seek(0.001, false);
      window.__overlay = ov;
    </script>
