<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Noto Sans Hebrew"; font-weight: 300; src: url("assets/fonts/noto-sans-hebrew-hebrew-300-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Noto Sans Hebrew"; font-weight: 300; src: url("assets/fonts/noto-sans-hebrew-latin-300-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Noto Sans Hebrew"; font-weight: 500; src: url("assets/fonts/noto-sans-hebrew-hebrew-500-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Noto Sans Hebrew"; font-weight: 500; src: url("assets/fonts/noto-sans-hebrew-latin-500-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Noto Sans Hebrew"; font-weight: 800; src: url("assets/fonts/noto-sans-hebrew-hebrew-800-normal.woff2") format("woff2"); unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
      @font-face { font-family: "Noto Sans Hebrew"; font-weight: 800; src: url("assets/fonts/noto-sans-hebrew-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      :root { --ink: #0c0c0e; --mute: #5a6270; --acc: #0b86bd; --cy: #1AAEE5; --claude: #D97757; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #f4f6f9; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f4f6f9; font-family: "Noto Sans Hebrew", sans-serif; }
      .blob { position: absolute; border-radius: 50%; pointer-events: none; }
      #b1 { width: 1300px; height: 1300px; left: -520px; top: -260px; background: radial-gradient(circle, rgba(26,174,229,0.30) 0%, rgba(26,174,229,0) 65%); }
      #b2 { width: 1400px; height: 1400px; left: 300px; top: 1000px; background: radial-gradient(circle, rgba(80,140,255,0.22) 0%, rgba(80,140,255,0) 65%); }
      #b3 { width: 1000px; height: 1000px; left: 380px; top: 300px; background: radial-gradient(circle, rgba(120,220,245,0.22) 0%, rgba(120,220,245,0) 65%); }
      .scene { position: absolute; inset: 0; }
      .title { position: absolute; left: 0; right: 0; text-align: center; direction: rtl; }
      .title h1 { margin: 0; font: 300 128px/1.16 "Noto Sans Hebrew"; color: var(--ink); white-space: nowrap; letter-spacing: -0.01em; text-shadow: 0 14px 34px rgba(20,30,45,0.08); }
      .w { display: inline-block; position: relative; opacity: 0; }
      .w.k { color: var(--acc); font-weight: 800; }
      #edl { display: inline-block; position: relative; } #strike { position: absolute; right: -3%; width: 106%; top: 54%; height: 12px; margin-top: -6px; border-radius: 6px; background: var(--ink); transform-origin: 100% 50%; }
      #claude { position: absolute; left: 395px; top: 655px; width: 290px; height: 290px; overflow: visible; }
      #tlc { position: absolute; left: 86px; top: 1030px; width: 908px; height: 400px; border-radius: 34px; background: rgba(255,255,255,0.82); box-shadow: 0 24px 60px rgba(20,40,70,0.12); overflow: hidden; opacity: 0; }
      #tlc .trk { position: absolute; left: 40px; right: 40px; height: 84px; border-radius: 14px; background: rgba(12,12,14,0.04); }
      #tlc .clip { position: absolute; top: 0; height: 84px; border-radius: 18px; }
      #tlc .c1 { background: linear-gradient(90deg, #1AAEE5, #4cc6f0); }
      #tlc .c2 { background: linear-gradient(90deg, #7fb2ff, #a5c8ff); }
      #tlc .c3 { background: #c9d3dd; }
      #ph { position: absolute; top: 30px; bottom: 30px; left: 60px; width: 5px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
      #ph::before { content: ""; position: absolute; left: -9px; top: -4px; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); }
      #s2 .title h1 { font-size: 220px; line-height: 1.1; }
      .step { position: absolute; border-radius: 30px; background: rgba(255,255,255,0.88); border: 2px solid rgba(26,174,229,0.16); box-shadow: 0 26px 60px rgba(20,40,70,0.12); direction: rtl; text-align: center; opacity: 0; box-sizing: border-box; }
      .step .lv { display: block; margin-top: 38px; font: 500 44px/1.1 "Noto Sans Hebrew"; color: var(--mute); }
      .step .pr { display: block; margin-top: 14px; font: 800 72px/1.1 "Noto Sans Hebrew"; letter-spacing: -0.03em; color: var(--ink); direction: ltr; opacity: 0; }
      .step .per { display: block; margin-top: 10px; font: 500 52px/1.1 "Noto Sans Hebrew"; color: var(--mute); opacity: 0; }
      #st1 { left: 719px; top: 1140px; width: 280px; height: 360px; }
      #st2 { left: 400px; top: 980px; width: 280px; height: 520px; }
      #st3 { left: 81px; top: 800px; width: 280px; height: 700px; }
      #hero { left: 108px; top: 760px; width: 864px; height: 680px; border-radius: 44px; border: 3px solid rgba(26,174,229,0.95); box-shadow: 0 40px 110px rgba(26,174,229,0.30), 0 0 0 6px rgba(26,174,229,0.18); }
      #hero .lv { font-size: 64px; margin-top: 110px; }
      #hero .pr { font-size: 190px; margin-top: 24px; opacity: 1; } #hero .per { font-size: 58px; }
      #halo { position: absolute; left: 40px; top: 600px; width: 1000px; height: 1000px; border-radius: 50%; background: radial-gradient(circle, rgba(26,174,229,0.32) 0%, rgba(26,174,229,0) 62%); opacity: 0; }
      .dot { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: #6b7d8f; opacity: 0; }
      .dot.hi { background: var(--cy); }
      #fin h1 { font-size: 200px; line-height: 1.1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.4" data-width="1080" data-height="1920">
      <div class="blob" id="b1"></div><div class="blob" id="b2"></div><div class="blob" id="b3"></div>

      <!-- S1 0–2.9: hook question + Claude mark + editing timeline -->
      <div class="scene" id="s1">
        <div class="title" id="t1a" style="top: 330px">
          <h1><span class="w" data-at="0.08">חושבים</span> <span class="w" data-at="0.46">שאתם</span></h1>
          <h1><span class="w k" data-at="0.74" data-pulse="1">יודעים?</span></h1>
        </div>
        <div class="title" id="t1b" style="top: 330px">
          <h1><span id="edl"><span class="w" data-at="1.1">לערוך</span> <span class="w k" data-at="1.42" data-pulse="1">סרטונים</span><i id="strike"></i></span></h1>
          <h1><span class="w" data-at="1.82">עם</span> <span class="w k" data-at="2.0" data-pulse="1">קלוד?</span></h1>
        </div>
        <svg id="claude" viewBox="-100 -100 200 200"><g id="rays"></g></svg>
        <div id="tlc">
          <div class="trk" style="top: 56px"><div class="clip c1" style="left: 0; width: 262px"></div><div class="clip c1" style="left: 276px; width: 190px"></div><div class="clip c1" style="left: 480px; width: 348px"></div></div>
          <div class="trk" style="top: 158px"><div class="clip c2" style="left: 96px; width: 316px"></div><div class="clip c2" style="left: 426px; width: 232px"></div></div>
          <div class="trk" style="top: 260px"><div class="clip c3" style="left: 0; width: 828px"></div></div>
          <div id="ph"></div>
        </div>
      </div>

      <!-- S2 2.9–3.75: the punch -->
      <div class="scene" id="s2">
        <div class="title" style="top: 740px">
          <h1><span class="w" data-at="2.92">אתם</span> <span class="w k" id="no">לא.</span></h1>
        </div>
      </div>

      <!-- S3 3.72–7.6: the three levels -->
      <div class="scene" id="s3">
        <div class="title" id="t3" style="top: 300px">
          <h1><span class="w" data-at="3.92">שלוש</span> <span class="w k" data-at="4.34" data-pulse="1">רמות</span></h1>
          <h1><span class="w" data-at="4.62">עריכה</span></h1>
        </div>
        <div class="title" id="t4" style="top: 300px">
          <h1><span class="w" data-at="5.3">רוב</span> <span class="w" data-at="5.64">האנשים</span></h1>
          <h1><span class="w k" data-at="6.16" data-pulse="1">תקועים</span> <span class="w" data-at="6.46">ברמה</span> <span class="w" data-at="6.8">1</span></h1>
        </div>
        <div class="title" id="t5" style="top: 340px">
          <h1><span class="w" data-at="7.66">הרמה</span> <span class="w k" data-at="7.96" data-pulse="1">השלישית</span></h1>
        </div>
        <div id="halo"></div>
        <div class="step" id="st1"><span class="lv">רמה 1</span><span class="pr">600₪</span></div>
        <div class="step" id="st2"><span class="lv">רמה 2</span><span class="pr">1,000₪</span></div>
        <div class="step" id="st3"><span class="lv">רמה 3</span><span class="pr">3,000₪</span></div>
        <div class="step" id="hero"><span class="lv">רמה 3</span><span class="pr" id="p3">0₪</span><span class="per" id="per">לסרטון</span></div>
        <div id="dots"></div>
      </div>

      <!-- S4 10.6–11.4: hand over to level 1 -->
      <div class="scene" id="fin">
        <div class="title" style="top: 800px">
          <h1><span class="w" id="f1">רמה</span> <span class="w k" id="f2">1</span></h1>
        </div>
      </div>

      <audio id="mix" src="assets/mix.wav" data-start="0" data-duration="11.4" data-track-index="1" data-volume="1"></audio>
    </div>
    <script>
      const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
      const tl = gsap.timeline({ paused: true });

      // ---------- helpers ----------
      const reveal = (el, t, d = 0.45) => tl.fromTo(el, { opacity: 0, filter: "blur(16px)", y: 26 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: d, ease: "power3.out" }, t);
      const pulse = (el, t) => { tl.to(el, { scale: 1.06, duration: 0.2, ease: "sine.out" }, t); tl.to(el, { scale: 1, duration: 0.2, ease: "sine.in" }, t + 0.2); };
      const blurOut = (el, t, d = 0.35, y = -30) => tl.to(el, { opacity: 0, filter: "blur(14px)", y, duration: d, ease: "power2.in" }, t);
      const shake = (el, t, a = 14) => { [a, -a * 0.8, a * 0.55, -a * 0.3, 0].forEach((x, i) => tl.to(el, { x, duration: 0.045, ease: "sine.inOut" }, t + i * 0.045)); };
      $$(".w[data-at]").forEach((w) => { const t = parseFloat(w.dataset.at); reveal(w, t); if (w.dataset.pulse) pulse(w, t + 0.42); });

      // ---------- background drift (continuous) ----------
      tl.fromTo("#b1", { x: 0, y: 0 }, { x: 260, y: 180, duration: 11.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#b2", { x: 0, y: 0 }, { x: -320, y: -260, duration: 11.4, ease: "sine.inOut" }, 0);
      tl.fromTo("#b3", { x: 0, y: 0, scale: 0.9 }, { x: -200, y: 120, scale: 1.15, duration: 11.4, ease: "sine.inOut" }, 0);

      // ---------- S1: Claude mark (12 rounded rays) ----------
      const rays = $("#rays"), L = [92, 78, 88, 74, 94, 82, 76, 90, 80, 86, 75, 89], A0 = [0, 31, 59, 91, 119, 151, 181, 209, 241, 269, 301, 329];
      L.forEach((len, i) => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `rotate(${A0[i] - 90})`);
        const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
        // tapered ray: wide near the tip, narrower at the hub, round ends
        p.setAttribute("d", `M 8 -5 L ${len - 9} -10.5 A 10.5 10.5 0 0 1 ${len - 9} 10.5 L 8 5 A 5 5 0 0 1 8 -5 Z`);
        p.setAttribute("fill", "#D97757");
        p.setAttribute("class", "ray");
        g.appendChild(p); rays.appendChild(g);
      });
      gsap.set(".ray", { scaleX: 0, transformOrigin: "0px 0px" });
      tl.fromTo("#claude", { rotation: -40, scale: 0.6, opacity: 0 }, { rotation: 0, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.7)" }, 2.0);
      tl.to(".ray", { scaleX: 1, duration: 0.42, ease: "back.out(2)", stagger: 0.022 }, 2.0);
      tl.to("#claude", { rotation: 18, duration: 0.6, ease: "none" }, 2.6);

      blurOut("#t1a", 0.98, 0.14);
      // timeline card: in on "לערוך", clips slide in, playhead scrubs
      tl.fromTo("#tlc", { opacity: 0, y: 70, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 1.1);
      $$("#tlc .clip").forEach((c, i) => tl.fromTo(c, { x: 140, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 1.18 + i * 0.06));
      tl.fromTo("#ph", { x: 0 }, { x: 740, duration: 1.7, ease: "none" }, 1.2);

      // 2.68 "אתם": strike through "יודעים" + hit; 2.86 the whole scene snaps away
      tl.fromTo("#strike", { scaleX: 0 }, { scaleX: 1, duration: 0.15, ease: "power3.out" }, 2.68);
      shake("#s1", 2.68, 12);
      tl.to("#s1", { scale: 1.08, opacity: 0, filter: "blur(16px)", duration: 0.16, ease: "power2.in" }, 2.86);
      tl.set("#s1", { visibility: "hidden" }, 3.05);

      // ---------- S2: "אתם לא." ----------
      tl.fromTo("#no", { opacity: 0, scale: 1.9, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.2, ease: "power4.out" }, 3.04);
      shake("#s2", 3.2, 16);
      pulse("#no", 3.34);
      tl.to("#s2", { opacity: 0, y: -60, filter: "blur(16px)", duration: 0.28, ease: "power2.in" }, 3.5);

      // ---------- S3: stairs ----------
      [["#st1", 3.92], ["#st2", 4.12], ["#st3", 4.34]].forEach(([s, t]) => tl.fromTo(s, { opacity: 0, y: 140, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, t));
      $$(".step .pr").forEach((p, i) => { tl.fromTo(p, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 4.62 + i * 0.12); });
      blurOut("#t3", 5.12, 0.3);

      // dots: most people pile up on level 1
      const dots = $("#dots"), D = [];
      const rows = [9, 8, 9, 8, 9, 8];
      rows.forEach((n, r) => { for (let i = 0; i < n; i++) { const off = (9 - n) * 14.75; D.push({ x: 727 + off + i * 29.5, y: 1140 - 31 - r * 25, s: 1 }); } });
      const N1 = D.length;
      D.push({ x: 482, y: 980 - 31, s: 2 }, { x: 526, y: 980 - 31, s: 2 }, { x: 570, y: 980 - 31, s: 2 }, { x: 207, y: 800 - 31, s: 3 });
      let rnd = 7; const R = () => ((rnd = (rnd * 16807) % 2147483647) / 2147483647);
      D.forEach((d, i) => {
        const el = document.createElement("div"); el.className = "dot" + (d.s === 3 ? " hi" : ""); el.style.left = d.x + "px"; el.style.top = d.y + "px";
        if (d.s === 1) el.style.background = `hsl(208, ${14 + R() * 14}%, ${40 + R() * 22}%)`;
        dots.appendChild(el); d.el = el;
        const t = d.s === 1 ? 5.64 + (i / N1) * 0.55 + R() * 0.05 : d.s === 2 ? 6.0 + (i - N1) * 0.06 : 6.2;
        tl.fromTo(el, { y: -200 - R() * 60 }, { y: 0, duration: 0.5, ease: "bounce.out" }, t); tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, t);
      });
      // "ברמה אחת": level 1 lights up, the crowd jostles
      tl.to("#st1", { borderColor: "rgba(26,174,229,0.9)", boxShadow: "0 26px 60px rgba(20,40,70,0.12), 0 0 0 4px rgba(26,174,229,0.35)", duration: 0.25 }, 6.46);
      pulse("#st1", 6.46);
      D.filter((d) => d.s === 1).forEach((d, i) => tl.to(d.el, { y: -10 - (i % 3) * 5, duration: 0.12, yoyo: true, repeat: 1, ease: "sine.out" }, 6.8 + (i % 7) * 0.025));
      blurOut("#t4", 7.36, 0.3);

      // ---------- S3b: level 3 lifts, price counts to 3,000 on "3,000" ----------
      D.forEach((d) => { if (d.s !== 3) tl.to(d.el, { y: 520, opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, d.s === 1 ? 7.56 : 7.62); });
      tl.to(D[D.length - 1].el, { opacity: 0, scale: 0, duration: 0.25, ease: "power2.in" }, 7.62);
      tl.to("#st1", { y: 520, opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, 7.56);
      tl.to("#st2", { y: 520, opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" }, 7.62);
      tl.to("#st3", { x: 319, y: -50, scale: 2.4, opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power3.in" }, 7.66);
      tl.fromTo("#hero", { x: -319, y: 50, scale: 0.33, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 7.86);
      tl.set("#p3", { opacity: 0 }, 0);
      tl.to("#halo", { opacity: 1, duration: 0.8, ease: "sine.out" }, 7.8);
      const cnt = { v: 0 }, p3 = $("#p3");
      const fmt = (v) => Math.round(v).toLocaleString("en-US") + "₪";
            tl.to(p3, { opacity: 1, duration: 0.15 }, 8.05);
      tl.fromTo(cnt, { v: 0 }, { v: 3000, duration: 0.85, ease: "power2.out", onUpdate: () => (p3.textContent = fmt(Math.round(cnt.v / 10) * 10)) }, 8.05);
      tl.set(p3, { textContent: "3,000₪", color: "#0b86bd" }, 8.9);
      tl.to(p3, { scale: 1.06, duration: 0.2, ease: "sine.out" }, 8.9);
      tl.to(p3, { scale: 1, duration: 0.2, ease: "sine.in" }, 9.1);
      tl.fromTo("#halo", { scale: 1 }, { scale: 1.15, duration: 0.25, yoyo: true, repeat: 1, ease: "sine.out" }, 8.9);
      tl.to("#per", { opacity: 1, duration: 0.01 }, 9.88);
      tl.fromTo("#per", { filter: "blur(14px)", y: 20 }, { filter: "blur(0px)", y: 0, duration: 0.4, ease: "power3.out" }, 9.88);
      tl.to("#hero", { y: -14, duration: 1.5, ease: "sine.inOut" }, 8.95);

      // ---------- dive into level 1 ----------
      blurOut("#t5", 10.42, 0.3);
      tl.to("#hero", { scale: 2.6, opacity: 0, filter: "blur(20px)", duration: 0.26, ease: "power3.in" }, 10.42);
      tl.to("#halo", { scale: 2.2, opacity: 0, duration: 0.45, ease: "power2.in" }, 10.45);
      tl.fromTo("#fin .title", { scale: 0.4, opacity: 0, filter: "blur(20px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 10.68);
      tl.set(["#f1", "#f2"], { opacity: 1 }, 10.68);
      pulse("#f2", 10.95);
      tl.to("#fin .title", { scale: 1.04, duration: 0.6, ease: "none" }, 11.13 - 0.0);

      tl.set({}, {}, 11.4);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
