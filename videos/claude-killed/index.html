    <style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.2" data-width="1920" data-height="1080">

          <div class="win" id="w2" style="left:300px;top:190px;width:440px;height:300px"><div class="bar"><i style="left:16px;background:#f26d5b"></i><i style="left:38px;background:#e9b23c"></i><i style="left:60px;background:#6fbf73"></i></div><div class="el" style="left:24px;top:70px;width:200px;height:22px;background:#2a2320"></div><div class="el" style="left:24px;top:106px;width:300px;height:12px;background:#cfc6bd"></div><div class="el" style="left:24px;top:150px;width:392px;height:120px;background:#ffd9c6"></div></div>
          <div class="win" id="w1" style="left:44px;top:150px;width:600px;height:440px">
            <div class="bar"><i style="left:16px;background:#f26d5b"></i><i style="left:38px;background:#e9b23c"></i><i style="left:60px;background:#6fbf73"></i><b>yoursite.co.il</b></div>

            <div class="el b" style="left:252px;top:112px;width:320px;height:34px;background:#2a2320"></div><div class="el b" style="left:332px;top:158px;width:240px;height:34px;background:#2a2320"></div><div class="el b" style="left:292px;top:210px;width:280px;height:12px;background:#b7aca2"></div><div class="el b" style="left:352px;top:232px;width:220px;height:12px;background:#b7aca2"></div>
            <div class="el b" style="left:412px;top:266px;width:160px;height:46px;border-radius:23px;background:#ff8a5c"></div><div class="el b" style="left:28px;top:108px;width:200px;height:204px;border-radius:16px;background:linear-gradient(140deg,#ffb48f,#d97757)"></div>
            <div class="el b" style="left:28px;top:340px;width:170px;height:80px;background:#ebe3da"></div><div class="el b" style="left:215px;top:340px;width:170px;height:80px;background:#ebe3da"></div><div class="el b" style="left:402px;top:340px;width:170px;height:80px;background:#ebe3da"></div>
          </div>

      <div id="tag">CLAUDE KILLED <b id="cnt">01</b></div>
      <div id="h1"><span class="cl">Claude</span><span>הרג</span><span>את</span></div>
      <div id="jobs"><div class="job" id="j0">עורכי הווידאו<i></i></div><div class="job" id="j1">מעצבי האתרים<i></i></div></div>
      <div id="vig"></div>
      <audio id="bed" src="assets/audio/bed.m4a" data-start="0" data-duration="5.2" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      // "Claude killed ___" — scene 1 for approval: the hook, the first job, and the switch to the second.
      const DUR = 5.2, SW = 2.85;   // SW: the moment the job flips
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;
      const outCubic = (x) => 1 - Math.pow(1 - x, 3), outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), inCubic = (x) => x * x * x, inOut = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
      const outBack = (x) => (x <= 0 ? 0 : 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2));
      const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
      // the spark mark: a small starburst
      { let d = ""; for (let i = 0; i < 12; i++) d += '<rect x="-1.5" y="-11" width="3" height="' + (i % 2 ? 7 : 10) + '" rx="1.5" transform="rotate(' + i * 30 + ')"/>'; $("#spk").innerHTML = d; }

      // ---------- the neon line: sweeps in from under the headline and closes a loop around the panel ----------
      const NS = "http://www.w3.org/2000/svg", X0 = 116, Y0 = 176, X1 = 944, Y1 = 904, R = 40;
      const LOOP = "L" + X1 + " " + (Y0 + R) + " A" + R + " " + R + " 0 0 0 " + (X1 - R) + " " + Y0 + " L" + (X0 + R) + " " + Y0 + " A" + R + " " + R + " 0 0 0 " + X0 + " " + (Y0 + R) + " L" + X0 + " " + (Y1 - R) + " A" + R + " " + R + " 0 0 0 " + (X0 + R) + " " + Y1 + " L" + (X1 - R) + " " + Y1 + " A" + R + " " + R + " 0 0 0 " + X1 + " " + (Y1 - R);
      const D1 = "M1810 690 C1560 700 1330 1010 1040 972 C980 962 " + X1 + " 930 " + X1 + " 860 " + LOOP + " L" + X1 + " 858";
      const mk = (g, cls, d) => { const p = document.createElementNS(NS, "path"); p.setAttribute("d", d); p.setAttribute("class", cls); $(g).appendChild(p); return p; };
      const line = [mk("#gH", "sH", D1), mk("#gT", "sT", D1), mk("#gC", "sC", D1)], LEN = line[1].getTotalLength();
      const pulse = [mk("#gH", "sH", D1), mk("#gC", "sC", D1)];
      const head = document.createElement("div"); head.className = "head"; head.innerHTML = "<b></b>"; $("#root").insertBefore(head, $("#panel"));
      const head2 = head.cloneNode(true); $("#root").insertBefore(head2, $("#panel"));

      // ---------- the timeline clips ----------
      const CL = [["t1", 8, 150, "#d97757"], ["t1", 164, 110, "#f3a777"], ["t1", 280, 190, "#b8553a"], ["t1", 476, 120, "#ffb48f"], ["t1", 602, 118, "#d97757"], ["t2", 8, 330, "a"], ["t2", 344, 376, "a"], ["t3", 60, 130, "#6f5a8f"], ["t3", 230, 170, "#6f5a8f"], ["t3", 470, 150, "#6f5a8f"]];
      const clips = CL.map(([tr, x, w, c], i) => { const e = document.createElement("div"); e.className = "clip" + (c === "a" ? " a" : ""); e.style.left = x + "px"; e.style.width = w + "px"; if (c !== "a") e.style.background = c; $("#" + tr).appendChild(e); return { e, t: 1.78 + i * 0.065 }; });
      const els = $$("#w1 .b").map((e, i) => ({ e, t: SW + 0.72 + i * 0.055 }));
      const PA = "תערוך לי רילס מהצילומים", PB = "תבנה לי אתר לעסק";
      const type = (el, cur, txt, t, a, d) => { const n = Math.floor(seg(t, a, a + d) * txt.length); el.textContent = txt.slice(0, n); cur.style.opacity = t > a - 0.1 && (n < txt.length || Math.floor(t * 4) % 2) ? 1 : 0; };
      const tf = (e, x, y, s, r = 0) => (e.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + r.toFixed(2) + "deg) scale(" + Math.max(0.0001, s).toFixed(3) + ")");

      function draw(t) {
        t = clamp(t, 0, DUR);
        const sw = seg(t, SW, SW + 0.5);
        // slow push-in on the whole frame, with a small kick on the flip
        const kick = seg(t, SW, SW + 0.08) * (1 - seg(t, SW + 0.08, SW + 0.45));
        [0, 1, 2].forEach((i) => ($("#b" + i).style.transform = "translate(" + (Math.sin(t * 0.5 + i * 2) * 90).toFixed(1) + "px," + (Math.cos(t * 0.4 + i * 1.7) * 70).toFixed(1) + "px) scale(" + (1 + 0.08 * Math.sin(t * 0.7 + i) + 0.1 * kick).toFixed(3) + ")"));
        // headline: words resolve from blur, the job slams in
        $$("#h1 span").forEach((s, i) => { const q = outExpo(seg(t, 0.2 + i * 0.13, 0.75 + i * 0.13)); s.style.opacity = q; s.style.filter = "blur(" + ((1 - q) * 16).toFixed(1) + "px)"; s.style.transform = "translateY(" + ((1 - q) * 46).toFixed(1) + "px)"; });
        const j0 = $("#j0"), j1 = $("#j1"), a0 = outExpo(seg(t, 0.72, 1.12)), st = outCubic(seg(t, SW - 0.3, SW - 0.02)), out = inCubic(seg(t, SW, SW + 0.26)), in1 = outExpo(seg(t, SW + 0.1, SW + 0.5));
        j0.style.opacity = a0 * (1 - out); j0.style.transform = "translateY(" + ((1 - a0) * 150 + out * 190).toFixed(1) + "px) scale(" + (1 + 0.5 * (1 - a0)).toFixed(3) + ") rotate(" + (out * 5).toFixed(2) + "deg)"; j0.style.filter = "blur(" + ((1 - a0) * 14 + out * 10).toFixed(1) + "px)";
        j0.querySelector("i").style.transform = "scaleX(" + st.toFixed(3) + ")"; j0.style.opacity = a0 * (1 - out) * (1 - 0.45 * st);
        j1.style.opacity = in1; j1.style.transform = "translateY(" + ((1 - in1) * -170).toFixed(1) + "px)"; j1.style.filter = "blur(" + ((1 - in1) * 12).toFixed(1) + "px)"; j1.querySelector("i").style.transform = "scaleX(0)";
        const tg = seg(t, 0.9, 1.3); $("#tag").style.opacity = tg; $("#cnt").textContent = t < SW + 0.1 ? "01" : "02"; $("#cnt").style.display = "inline-block"; $("#cnt").style.transform = "scale(" + (1 + 0.5 * kick).toFixed(3) + ")";
        // the neon line and its spark
        const p = inOut(seg(t, 0.78, 1.95)); line.forEach((l) => { l.style.strokeDasharray = LEN + " " + LEN; l.style.strokeDashoffset = (LEN * (1 - p)).toFixed(1); });
        const pt = line[1].getPointAtLength(LEN * p); head.style.transform = "translate(" + pt.x.toFixed(1) + "px," + pt.y.toFixed(1) + "px) scale(" + (p > 0 && p < 1 ? 1 : 0.0001) + ")";
        const loop0 = 0.47, pp = seg(t, SW - 0.02, SW + 0.62), a = lerp(loop0, 1, inOut(pp)) * LEN, wlen = 420 * Math.sin(pp * Math.PI) + 1;
        pulse.forEach((l) => { l.style.strokeDasharray = wlen.toFixed(1) + " " + (LEN * 2); l.style.strokeDashoffset = (-(a - wlen)).toFixed(1); l.style.opacity = pp > 0 && pp < 1 ? 1 : 0; l.style.strokeWidth = l.classList.contains("sH") ? 34 : 4; });
        const p2 = line[1].getPointAtLength(a); head2.style.transform = "translate(" + p2.x.toFixed(1) + "px," + p2.y.toFixed(1) + "px) scale(" + (pp > 0 && pp < 1 ? 1.25 : 0.0001) + ")";
        // the panel
        const pin = outExpo(seg(t, 0.55, 1.15)); $("#panel").style.opacity = pin; tf($("#panel"), 0, (1 - pin) * 70, 0.94 + 0.06 * pin + 0.02 * kick);
        const A = $("#sA"), B = $("#sB"); A.style.opacity = 1 - seg(t, SW, SW + 0.18); tf(A, -sw * 0, 0, 1 - 0.08 * seg(t, SW, SW + 0.18)); B.style.opacity = seg(t, SW + 0.12, SW + 0.3); A.style.filter = "blur(" + (seg(t, SW, SW + 0.18) * 10).toFixed(1) + "px)";
        // A: prompt -> the timeline assembles itself
        type($("#pA"), $("#cA"), PA, t, 1.05, 0.62);
        clips.forEach((c, i) => { const q = outBack(seg(t, c.t, c.t + 0.3)); c.e.style.opacity = seg(t, c.t, c.t + 0.08); tf(c.e, (1 - q) * 260, 0, 0.7 + 0.3 * q); });
        const play = seg(t, 1.85, SW); $("#ph").style.left = (44 + play * 700).toFixed(1) + "px"; $("#ph").style.opacity = seg(t, 1.7, 1.85); $("#prevG").style.backgroundPosition = (play * 100).toFixed(1) + "% 0"; $("#prevG").style.opacity = 0.25 + 0.75 * seg(t, 1.8, 2.1);
        $("#prevP").style.opacity = 1 - seg(t, 1.8, 2.0); $("#prevT").textContent = "00:" + String(Math.floor(play * 12)).padStart(2, "0");
        const dA = outBack(seg(t, 2.3, 2.6)); $("#dA").style.opacity = dA > 0 ? 1 : 0; tf($("#dA"), 0, (1 - dA) * 30, dA);
        // B: prompt -> the site builds itself
        type($("#pB"), $("#cB"), PB, t, SW + 0.25, 0.45);
        const w1 = outBack(seg(t, SW + 0.5, SW + 0.9)), w2 = outBack(seg(t, SW + 1.25, SW + 1.6)); $("#w1").style.opacity = w1 > 0 ? 1 : 0; tf($("#w1"), 0, (1 - w1) * 80, 0.8 + 0.2 * w1, -2 + 2 * w1); $("#w2").style.opacity = w2 > 0 ? 1 : 0; tf($("#w2"), (1 - w2) * -120, 0, 0.8 + 0.2 * w2, 5);
        els.forEach((o) => { const q = outBack(seg(t, o.t, o.t + 0.26)); o.e.style.opacity = q > 0 ? 1 : 0; tf(o.e, 0, (1 - q) * 22, 0.6 + 0.4 * q); });
        const dB = outBack(seg(t, SW + 1.75, SW + 2.05)); $("#dB").style.opacity = dB > 0 ? 1 : 0; tf($("#dB"), 0, (1 - dB) * 30, dB);
      }
      const tl = gsap.timeline({ paused: true }), pr = { t: 0 };
      tl.to(pr, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(pr.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; window.__draw = draw;
    </script>
