<!doctype html>
<html lang="he">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/theme/vendor/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/theme/tokens.css" />
    <link rel="stylesheet" href="assets/theme/theme.css" />
    <script src="assets/theme/motion.js"></script>
    <style>
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: #000; }

      /* ambient sources: the media's own colors, blurred by .s-amb */
      .src-a { background: radial-gradient(circle at 30% 30%, #3a5bff, transparent 55%), radial-gradient(circle at 75% 70%, #ff6a3d, transparent 50%), #101018; }
      .src-b { background: radial-gradient(circle at 70% 30%, #c8b79c, transparent 55%), radial-gradient(circle at 25% 75%, #7a6a52, transparent 55%), #2a2620; }
      .src-c { background: radial-gradient(circle at 30% 35%, #ff3d6e, transparent 50%), radial-gradient(circle at 70% 70%, #6b2bff, transparent 55%), #12091c; }

      /* a website shown in a media frame: only big, readable parts (>=26px as shown) */
      .site { position: absolute; inset: 0; direction: rtl; overflow: hidden; }
      .site nav { position: absolute; right: 34px; left: 34px; top: 26px; display: flex; justify-content: space-between; font-size: 30px; font-weight: 800; }
      .site h3 { position: absolute; right: 34px; top: 110px; margin: 0; font-size: 92px; line-height: 0.98; font-weight: 800; white-space: pre; letter-spacing: -3px; }
      .site .btn { position: absolute; right: 34px; bottom: 40px; height: 76px; padding: 0 36px; border-radius: 38px; font-size: 34px; font-weight: 800; display: flex; align-items: center; }
      .site .img { position: absolute; left: 34px; bottom: 40px; width: 250px; height: 250px; border-radius: 30px; overflow: hidden; }
      .site.plain { background: #f2f2f2; color: #333; font-family: "Times New Roman", serif; letter-spacing: 0; }
      .site.plain h3 { font-weight: 400; font-size: 76px; letter-spacing: 0; }
      .site.plain .btn { background: #ccc; color: #333; border-radius: 0; font-family: "Times New Roman", serif; font-weight: 400; }
      .site.plain .img { background: #ddd; }
      .site.bold { background: #0d0d12; color: #fff; }
      .site.bold h3 { color: #fff; } .site.bold h3 b { color: var(--s-yellow); font-weight: 800; }
      .site.bold .btn { background: var(--s-blue); color: #fff; }
      .site.bold .img { background: radial-gradient(circle at 35% 35%, #ff6a3d, #6b2bff 70%); }
      .site.warm { background: #f6efe4; color: #2a2118; }
      .site.warm .btn { background: #2a2118; color: #fff; }
      .site.warm .img { background: linear-gradient(135deg, #c65a3c, #e8a06a); }

      #tile0 { left: 420px; top: 240px; background: linear-gradient(140deg, #3a5bff, #1e2fbf); }
      #med0, #med3a, #med3b { left: 90px; right: 90px; top: 110px; height: 560px; }

      /* sprites on the chest (face layout): three agents */
      #sp1 { right: 270px; top: 1610px; } #sp2 { right: 540px; top: 1610px; } #sp3 { right: 810px; top: 1610px; }
      #ic1 { right: 270px; top: 1480px; } #ic2 { right: 540px; top: 1480px; } #ic3 { right: 810px; top: 1480px; }
      .ok { } #ok1 { right: 270px; top: 1480px; } #ok2 { right: 540px; top: 1480px; } #ok3 { right: 810px; top: 1480px; }
      #lb1 { right: 270px; top: 1730px; } #lb2 { right: 540px; top: 1730px; } #lb3 { right: 810px; top: 1730px; }

      /* S2: install card on the page */
      #card2 { left: 110px; right: 110px; top: 560px; height: 560px; }
      #card2 .dl { width: 150px; height: 150px; border-radius: 34px; background: var(--s-blue); margin: 40px auto 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 40px rgba(7, 79, 250, 0.35); }
      #card2 .dl svg { width: 84px; height: 84px; }
      #card2 .st { text-align: center; font-size: 44px; font-weight: 800; }
      #card2 .pr { display: flex; align-items: center; gap: 22px; margin: 26px 50px 0; }
      #card2 .pr .s-prog { flex: 1; }
      #card2 .cmd { margin: 30px 50px 0; height: 72px; border-radius: 14px; background: #f1f2f6; display: flex; align-items: center; padding: 0 22px; color: #333; }
      #pill2 { right: 540px; top: 1170px; }

      /* CTA: the DM card arriving */
      #dm { left: 120px; right: 120px; top: 300px; z-index: 34; }
      #dm .row { gap: 22px; } #dm .av { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(140deg, #3a5bff, #1e2fbf); display: flex; align-items: center; justify-content: center; flex: none; }
      #dm .av svg { width: 36px; height: 36px; }
      #dm small { display: block; font-size: 28px; color: var(--s-ink-soft); font-weight: 600; }
      #ctaKey { top: 1500px; }
    </style>
  </head>
  <body>
    <div id="root" class="s-root" data-composition-id="main" data-start="0" data-duration="17.2" data-width="1080" data-height="1920">
      <div id="face" class="s-face grade"><video id="faceVid" src="assets/video/face.mp4" data-start="0" data-duration="17.2" data-track-index="0" muted playsinline></video></div>

      <!-- the top surface: scenes carry their own background (ambient or page) -->
      <div id="top" class="s-top">
        <!-- hook (split, ambient): the skill as a tile, then a real site -->
        <div id="s0" class="s-scene">
          <div class="s-amb"><div class="src-a"></div></div>
          <div id="tile0" class="s-tile aa"></div>
          <div id="med0" class="s-media aa"><div class="site warm"><nav><span>סטודיו נוי</span><span>☰</span></nav><h3>עיצוב פנים
שמרגיש בית</h3><span class="btn">לתיאום</span><div class="img"></div></div></div>
        </div>

        <!-- S2 (full page): the install — command typed, the bar fills and lands on "Kowalski" -->
        <div id="s2" class="s-scene">
          <div class="s-page cool"></div>
          <div id="head2" class="s-head">מתקינים<span class="b" dir="ltr">Kowalski</span></div>
          <div id="card2" class="s-card aa">
            <div class="dl" id="dl2"></div>
            <div class="st" id="st2">מתקין…</div>
            <div class="cmd mono">› <span id="cmdT"></span></div>
            <div class="pr" dir="ltr"><span class="s-pct" id="pct2">0%</span><div class="s-prog"><i id="bar2"></i></div></div>
          </div>
          <div id="pill2" class="s-pill">✓ הותקן</div>
        </div>

        <!-- S3 (split, ambient): the same site, before → after on "הופך" -->
        <div id="s3" class="s-scene">
          <div class="s-amb"><div class="src-b" id="amb3a"></div><div class="src-c" id="amb3b"></div></div>
          <div id="med3a" class="s-media aa"><div class="site plain"><nav><span>סטודיו נוי</span><span>תפריט</span></nav><h3>עיצוב פנים</h3><span class="btn">צור קשר</span><div class="img"></div></div></div>
          <div id="med3b" class="s-media aa"><div class="site bold"><nav><span>סטודיו נוי</span><span>☰</span></nav><h3>עיצוב פנים
<b>שמרגיש בית</b></h3><span class="btn">לתיאום ←</span><div class="img"></div></div></div>
        </div>
      </div>
      <div id="seam" class="s-seam"></div>

      <!-- S1 (face): three pixel agents land on the chest, one per word; all get a check on "כמו שצריך" -->
      <div class="s-sprite" id="sp1"></div><div class="s-sprite" id="sp2"></div><div class="s-sprite" id="sp3"></div>
      <div class="s-icon" id="ic1"></div><div class="s-icon" id="ic2"></div><div class="s-icon" id="ic3"></div>
      <div class="s-icon" id="ok1"></div><div class="s-icon" id="ok2"></div><div class="s-icon" id="ok3"></div>
      <div class="s-plabel" id="lb1">Motion</div><div class="s-plabel" id="lb2">מעברים</div><div class="s-plabel" id="lb3">מבנה</div>

      <div id="caps" class="s-caps"></div>
      <div id="ctaKey" class="s-key"><span lang="en">Kowalski</span></div>
      <div id="dm" class="s-card aa"><div class="bd"><div class="row"><div class="av" id="dmAv"></div><div>Kowalski<small>שלחתי לך את הקישור</small></div><div class="ck" id="dmCk"></div></div></div></div>

      <audio id="vo" src="assets/audio/vo.mp3" data-start="0" data-duration="17.2" data-track-index="10" data-volume="1"></audio>
<!--__SFX__-->
    </div>
    <script>
      const WORDS = __WORDS__;
      const S = window.NEONSTUDIO;
      document.fonts.ready.then(() => {
        const tl = gsap.timeline({ paused: true });
        S.art("#tile0", S.ART.spark4); S.art("#dl2", S.ART.download); S.art("#dmAv", S.ART.spark4);
        document.querySelector("#dmCk").innerHTML = S.ART.check;
        S.art(["#sp1", "#sp2", "#sp3"], S.ART.sprite());
        S.art("#ic1", S.ART.icon("spark")); S.art("#ic2", S.ART.icon("up")); S.art("#ic3", S.ART.icon("eye"));
        S.art(["#ok1", "#ok2", "#ok3"], S.ART.icon("check"));
        // the yellow keyword of each beat
        WORDS.forEach((w) => { if (/^(טוב|Kowalski\.|למטורף\.)$/.test(w.text)) w.key = true; });

        // ---- layouts ----
        S.layout(tl, "split", 0, { shift: 400 });
        S.layout(tl, "face", 2.92);
        S.layout(tl, "full", 6.62);
        S.layout(tl, "split", 9.92);
        S.layout(tl, "face", 12.9);
        S.scene(tl, "#s0", 0, 2.92); S.scene(tl, "#s2", 6.62, 9.92); S.scene(tl, "#s3", 9.92, 12.9);

        // captions: chest on the face (this speaker's chin is low), above the seam in split, ink on the page; none under the CTA keyword's own line
        S.captions(tl, "#caps", WORDS, { yFace: 1300, ySplit: 815, yFull: 1330, ink: (t) => S.modeAt(t) === "full", until: 14.55 });
        S.captions(tl, "#caps", WORDS.filter((w) => w.start >= 14.55), { yFace: 1330 });

        // ---- hook (split): the tile lands, the site replaces it on "אתרים", the button pulses on "טוב" ----
        S.pop(tl, "#tile0", 0.2);
        S.pulse(tl, "#tile0", 0.8, 1.1);
        S.hide(tl, "#med0"); S.out(tl, "#tile0", 1.15);
        S.blurIn(tl, "#med0", 1.2, 0, { y: 30 });
        S.pulse(tl, "#med0 .btn", 2.2, 1.15);

        // ---- S1 (face): pixel agents land on their words, all checked on "כמו שצריך" ----
        S.sprites(tl, ["#sp1", "#sp2", "#sp3"], [3.2, 4.5, 5.4], 0, { until: 6.62 });
        S.icons(tl, ["#ic1", "#ic2", "#ic3"], [3.35, 4.65, 5.55], 0, 6.0);
        S.blurIn(tl, ["#lb1", "#lb2", "#lb3"], [3.3, 4.6, 5.5]);
        tl.set(["#lb1", "#lb2", "#lb3"], { opacity: 0 }, 6.62);
        S.icons(tl, ["#ok1", "#ok2", "#ok3"], 6.0, 0.1, 6.62);

        // ---- S2 (page): header, card, the command typed, the bar lands on "Kowalski", then the pill ----
        S.blurIn(tl, "#head2", 6.66);
        S.blurIn(tl, "#card2", 6.8, 0, { y: 40 });
        S.type(tl, "#cmdT", "npx skills add kowalski", 7.05, 26);
        S.progress(tl, "#bar2", "#pct2", 0, 100, 7.95, 0.85);
        S.hide(tl, "#pill2");
        S.pop(tl, "#pill2", 9.0);
        tl.set("#st2", { opacity: 1 }, 0);

        // ---- S3 (split): before → after on "הופך", the payoff on "למטורף" ----
        S.blurIn(tl, "#med3a", 9.98, 0, { y: 30 });
        S.hide(tl, "#med3b"); S.hide(tl, "#amb3b");
        S.swap(tl, "#med3a", "#med3b", 11.1);
        S.swap(tl, "#amb3a", "#amb3b", 11.1);
        S.zoom(tl, "#med3b", 12.1, 1.06, [450, 320], 0.35);

        // ---- CTA (face): the thin keyword holds, the DM arrives and gets its check ----
        S.key(tl, "#ctaKey", 14.6);
        S.hide(tl, "#dm");
        S.blurIn(tl, "#dm", 15.4, 0, { y: -30 });
        S.check(tl, "#dmCk", 16.05);

        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
