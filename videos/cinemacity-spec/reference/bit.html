      #halo { position: absolute; inset: 0; background: radial-gradient(ellipse 55% 60% at 50% 52%, rgba(57, 237, 246, 0.16) 0, rgba(40, 190, 200, 0.06) 45%, rgba(0, 0, 0, 0) 74%); }

      .aa { outline: 1px solid transparent; -webkit-backface-visibility: hidden; backface-visibility: hidden; }

      .sH { fill: none; stroke: #16c4d2; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round; }
      .sT { fill: none; stroke: #39edf6; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .sC { fill: none; stroke: #f0ffff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .head { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 3; }
      .head b { position: absolute; left: -36px; top: -36px; width: 72px; height: 72px; border-radius: 50%; background: radial-gradient(circle, #fff 0, #dcffff 18%, rgba(57, 237, 246, 0.55) 38%, rgba(57, 237, 246, 0) 70%); }
      .head i { position: absolute; left: -110px; top: -2px; width: 220px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(57, 237, 246, 0), rgba(230, 255, 255, 0.95), rgba(57, 237, 246, 0)); }
      .nf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; z-index: 6; pointer-events: none; }

      .badge { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: var(--bit); box-shadow: 0 0 22px rgba(57, 237, 246, 0.9); display: flex; align-items: center; justify-content: center; z-index: 6; }

      #digit { position: absolute; left: 262px; top: 67px; width: 105px; height: 151px; overflow: hidden; background: #f1f0f2; }
      #digit div { position: absolute; left: 0; top: 0; width: 105px; height: 302px; }

      #notif { position: absolute; left: 330px; top: 300px; width: 560px; height: 112px; border-radius: 30px; background: rgba(250, 251, 252, 0.97); box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55); display: flex; align-items: center; gap: 20px; padding: 0 22px; box-sizing: border-box; direction: rtl; color: #121516; }
      #notif img { width: 72px; height: 72px; border-radius: 18px; }
      #notif b { display: block; font-size: 30px; font-weight: 700; }

      .fr { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: 800; color: #0d1e20; box-shadow: 0 16px 34px rgba(0, 0, 0, 0.5); }
      .cf { position: absolute; width: 14px; height: 26px; border-radius: 4px; }

      #t6 { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font-size: 170px; font-weight: 800; line-height: 1.04; letter-spacing: -4px; }

        tl.fromTo(d, { x: 0, y: 0 }, { x: 60 + rnd() * 120, y: -30 - rnd() * 60, duration: 19.5, ease: "none", ...IR }, 0);
      }
      tl.set("#dustL", { opacity: 1 }, 0);
      tl.set("#dustL", { opacity: 0 }, 20.2);

      // ---------- headlines ----------
      const words = (sel) => {
        const el = $(sel);
        Array.from(el.childNodes).forEach((n) => {
          if (n.nodeType === 3) {
            const f = document.createDocumentFragment();
            n.textContent.split(/(\s+)/).forEach((t) => { if (!t) return; if (/^\s+$/.test(t)) { f.appendChild(document.createTextNode(" ")); return; } const sp = document.createElement("span"); sp.className = "w"; sp.textContent = t; f.appendChild(sp); });
            n.replaceWith(f);
          } else if (n.nodeName === "EM") n.classList.add("w");
        });
        return $$(sel + " .w");
      };
      const headline = (sel, a, b) => {
        const ws = words(sel);
        ft(ws, { opacity: 0, y: 60, filter: "blur(14px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.07 }, a);
        if (b != null) tl.to(ws, { opacity: 0, y: -36, filter: "blur(12px)", duration: 0.2, ease: "power2.in", stagger: 0.02 }, b - 0.22);
      };
      const phoneIn = (sel, at) => {
        ft(sel, { opacity: 0, rotationY: 28, z: -260 }, { opacity: 1, rotationY: -10, z: 0, duration: 0.9, ease: "expo.out" }, at);
        tl.to(sel, { rotationY: -4, rotationX: 2, duration: 2.6, ease: "sine.inOut" }, at + 0.9);
        ft(sel + " .shine i", { x: 0 }, { x: 760, duration: 1.2, ease: "power2.inOut" }, at + 0.35);
      };
      const tap = (sel, at) => ft(sel, { scale: 0, opacity: 0 }, { keyframes: [{ scale: 1, opacity: 1, duration: 0.12 }, { scale: 1.7, opacity: 0, duration: 0.42 }] }, at);

      // P0 hook
      const t0w = $$("#t0 .w");
      ft(t0w.slice(0, 2), { opacity: 0, scale: 1.35, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "expo.out", stagger: 0.36 }, 0.1);
      ft(t0w[2], { opacity: 0, scale: 1.5, filter: "blur(22px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "back.out(1.6)" }, 1.26);

      // P1 enter Bit, tap transfer, pick the amount
      phoneIn("#ph1", 2.2);
      headline("#h1", 2.22, 3.24);
      headline("#h2", 3.24, 4.64);
      headline("#h3", 4.64, null);
      ft("#popBtn", { opacity: 0, scale: 0.25, x: -300, y: -110 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.5, ease: "back.out(1.5)" }, 3.55);
      tap("#tap1", 3.95);
      tl.to("#popBtn", { scale: 0.9, duration: 0.07, yoyo: true, repeat: 1 }, 3.95);
      tl.to("#popBtn", { opacity: 0, scale: 0.6, x: -200, duration: 0.3, ease: "power2.in" }, 4.4);
      tl.set(["#sAm0", "#sAm10"], { opacity: 0 }, 0);
      tl.set("#sAm0", { opacity: 1 }, 4.5);
      ft("#sAm0", { y: 70 }, { y: 0, duration: 0.4, ease: "expo.out" }, 4.5);
      tl.set("#sAm10", { opacity: 1 }, 5.1);
      ft("#popAmt", { opacity: 0, scale: 0.4, x: -460, y: -389 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.55, ease: "back.out(1.4)" }, 4.98);

      // P2 the money travels: a ₪10 coin rides the arc from the transfer button to Dad
      ft("#oSend", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 5.75);
      ft("#oDad", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, 5.85);
      ft("#lDad", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 6.0);
      headline("#h4", 5.7, null);
      tl.set("#dadRing", { opacity: 0 }, 0);
      const AL = arc.getTotalLength(), ckf = [], ae = gsap.parseEase("power1.inOut");
      for (let i = 1; i <= 24; i++) { const pt = arc.getPointAtLength(AL * ae(i / 24)); ckf.push({ x: pt.x - X(2, 0), y: pt.y, duration: 0.65 / 24 }); }
      const c0 = arc.getPointAtLength(0);
      tl.set("#coin", { x: c0.x - X(2, 0), y: c0.y, scale: 0, opacity: 0 }, 0);
      tl.to("#coin", { scale: 1, opacity: 1, duration: 0.15 }, 6.05);
      tl.to("#coin", { keyframes: ckf, ease: "none" }, 6.1);
      tl.to("#coin", { scale: 0.2, opacity: 0, duration: 0.18, ease: "power2.in" }, 6.75);
      tl.to("#dadRing", { opacity: 1, duration: 0.15 }, 6.78);
      tl.to("#oDad", { scale: 1.12, duration: 0.14, yoyo: true, repeat: 1 }, 6.78);
      ft("#ok2", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(3)" }, 6.85);

      // P3 money arrives, stays as balance: 1,230 rolls to 1,330
      ft("#bal", { opacity: 0, y: 90, rotationX: 14 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.7, ease: "expo.out" }, 7.75);
      ft("#notif", { opacity: 0, y: -120 }, { opacity: 1, y: 0, duration: 0.6, ease: "back.out(1.6)" }, 8.2);
      headline("#h5", 7.7, 9.02);
      headline("#h6", 9.02, null);
      ft("#strip", { y: 0 }, { y: -151, duration: 0.45, ease: "back.out(1.4)" }, 9.86);
      tl.set("#bal", { boxShadow: "0 30px 70px rgba(0,0,0,0.6), 0 0 0px 0px rgba(57,237,246,0)" }, 0);
      tl.to("#bal", { boxShadow: "0 30px 70px rgba(0,0,0,0.6), 0 0 60px 6px rgba(57,237,246,0.5)", duration: 0.35 }, 9.9);
      tl.to("#notif", { opacity: 0, y: -60, duration: 0.3, ease: "power2.in" }, 9.7);

      // P4 withdraw to the bank with one tap
      phoneIn("#ph4", 10.55);
      headline("#h7", 10.54, 11.5);
      headline("#h8", 11.5, null);
      ft("#popWd", { opacity: 0, scale: 0.5, x: -490, y: -108 }, { opacity: 1, scale: 1, x: 0, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 11.3);
      tap("#tap2", 11.62);
      tl.to("#popWd", { scale: 0.95, duration: 0.07, yoyo: true, repeat: 1 }, 11.62);
      tl.to("#popWd", { opacity: 0, x: -120, duration: 0.3, ease: "power2.in" }, 12.3);

      // P5 birthday: group screen, confetti, friends join
      phoneIn("#ph5", 13.05);
      headline("#h9", 13.02, 14.76);
      headline("#h10", 14.76, null);
      const cols = ["#39edf6", "#d6f65c", "#f2a7bf", "#cbbcff", "#ffffff"];
      for (let i = 0; i < 26; i++) {
        const c = document.createElement("div"); c.className = "cf"; c.style.background = cols[i % 5];
        c.style.left = "500px"; c.style.top = "330px"; $("#confetti").appendChild(c);
        const ang = -Math.PI / 2 + (rnd() - 0.5) * 2.4, sp = 260 + rnd() * 260;
        ft(c, { x: 0, y: 0, rotation: 0, opacity: 0 }, { keyframes: [{ opacity: 1, duration: 0.05 }, { x: Math.cos(ang) * sp, y: Math.sin(ang) * sp, rotation: rnd() * 540, duration: 0.7, ease: "power2.out" }, { y: "+=" + (260 + rnd() * 200), opacity: 0, rotation: "+=180", duration: 1.0, ease: "power1.in" }] }, 14.0 + rnd() * 0.15);
      }
      tl.to("#ph5", { scale: 1.04, duration: 0.18, yoyo: true, repeat: 1 }, 15.06);

      // P6 sign-off, then the turquoise bloom and the real logo
      const t6w = $$("#t6 .w");
      [16.9, 17.7, 18.1].forEach((t, i) => ft(t6w[i], { opacity: 0, y: 60, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, t));
      ft(t6w.slice(3), { opacity: 0, scale: 1.5, filter: "blur(20px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "back.out(1.8)", stagger: 0.14 }, 18.94);
      ft("#bloom", { clipPath: "circle(0px at 960px 860px)" }, { clipPath: "circle(1500px at 960px 860px)", duration: 0.45, ease: "power3.in" }, 19.95);

      // credits
      ft("#cred small", { opacity: 0, scaleX: 1.4 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "expo.out" }, 22.95);
      ft("#cred b", { opacity: 0, y: 40, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.65, ease: "expo.out" }, 23.15);
      ft("#credl", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 23.45);

      // master: 2s logo opener, then the film on the narration clock
      const master = gsap.timeline({ paused: true });
      master.set("#ilogo", { scale: 0, opacity: 0, rotation: -12 }, 0);
      master.to("#ilogo", { scale: 1, opacity: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, 0.08);
      master.to("#ilogo", { scale: 1.06, duration: 0.25, ease: "sine.inOut" }, 0.5);
      master.to("#ilogo", { scale: 0, opacity: 0, rotation: 10, duration: 0.22, ease: "back.in(2)" }, 0.76);
      // put every element in its film-start state at load, so the frame where the opener hands over can never show a default layout
      tl.seek(0.001, false);
      master.add(tl, 1.0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = master;
    </script>
  </body>
</html>
