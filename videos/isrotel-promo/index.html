    <style>
      @font-face { font-family: "Heebo"; font-weight: 300; src: url("assets/fonts/heebo-hebrew-300.woff2") format("woff2"); unicode-range: U+0590-05FF, U+20AA; }
      @font-face { font-family: "Heebo"; font-weight: 300; src: url("assets/fonts/heebo-latin-300.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("assets/fonts/heebo-hebrew-400.woff2") format("woff2"); unicode-range: U+0590-05FF, U+20AA; }
      @font-face { font-family: "Heebo"; font-weight: 400; src: url("assets/fonts/heebo-latin-400.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("assets/fonts/heebo-hebrew-700.woff2") format("woff2"); unicode-range: U+0590-05FF, U+20AA; }
      @font-face { font-family: "Heebo"; font-weight: 700; src: url("assets/fonts/heebo-latin-700.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F; }
      :root { --n: #002d74; --ink: #1b2233; --sun: #ffd21f; --mut: #7b8499; }
      html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; background: #f5f7fb; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #f5f7fb; font-family: "Heebo", sans-serif; color: var(--ink); perspective: 2200px; }
      .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
      #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-style: preserve-3d; transform-origin: 50% 50%; }
      .c { position: absolute; background: #fff; border-radius: 22px; box-shadow: 0 34px 90px rgba(0, 45, 116, 0.16), 0 4px 14px rgba(0, 20, 60, 0.06); direction: rtl; will-change: transform; }
      .fld { height: 104px; display: flex; align-items: center; gap: 18px; padding: 0 30px; box-sizing: border-box; font-size: 28px; font-weight: 400; color: var(--mut); white-space: nowrap; }
      .fld svg { width: 34px; height: 34px; flex: none; stroke: var(--n); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .fld b { color: var(--ink); font-weight: 400; }
      #btn { background: var(--n); color: #fff; font-size: 30px; font-weight: 700; justify-content: center; box-shadow: 0 34px 80px rgba(0, 45, 116, 0.42), 0 4px 14px rgba(0, 20, 60, 0.2); overflow: hidden; }
      #rip { position: absolute; left: 50%; top: 50%; width: 40px; height: 40px; margin: -20px; border-radius: 50%; background: rgba(255, 255, 255, 0.45); }
      #h { position: absolute; left: 0; right: 0; top: 250px; text-align: center; direction: rtl; font-size: 86px; font-weight: 300; color: var(--n); white-space: nowrap; }
      #h span { display: inline-block; margin: 0 12px; }
      #logo { position: absolute; left: 660px; top: 356px; width: 600px; height: 354px; overflow: visible; transform-origin: 50% 50%; }
      #logo path { fill: #002d74; fill-rule: evenodd; stroke: #002d74; stroke-width: 1.6; stroke-linejoin: round; }
      #rings { position: absolute; left: 960px; top: 520px; width: 0; height: 0; transform-style: preserve-3d; }
      #rings i { position: absolute; border-radius: 50%; border: 2.5px solid #002d74; }
      #tagline { position: absolute; left: 0; right: 0; top: 690px; text-align: center; direction: rtl; font-size: 40px; font-weight: 300; color: var(--n); opacity: 0; }
      /* suggestion + calendar */
      #sug { display: flex; align-items: center; gap: 20px; padding: 18px 22px; box-sizing: border-box; }
      #sug img { width: 132px; height: 96px; object-fit: cover; border-radius: 14px; }
      #sug .t { font-size: 34px; font-weight: 700; color: var(--n); line-height: 1.1; } #sug .s { font-size: 22px; color: var(--mut); margin-top: 6px; } #sug .x { margin-right: auto; white-space: nowrap; font: 400 16px "Heebo"; letter-spacing: 1px; color: #fff; background: #1b2233; padding: 6px 12px; border-radius: 6px; direction: ltr; }
      #cal { padding: 26px 30px; box-sizing: border-box; }
      #cal .m { font-size: 30px; font-weight: 700; color: var(--n); text-align: center; margin-bottom: 16px; }
      #cal .g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px 0; direction: rtl; text-align: center; font-size: 24px; }
      #cal .g i { font-style: normal; color: var(--mut); font-size: 20px; height: 36px; line-height: 36px; }
      #cal .g u { text-decoration: none; height: 50px; line-height: 50px; position: relative; color: var(--ink); }
      #cal .g u s { position: absolute; inset: 0; background: rgba(0, 45, 116, 0.1); text-decoration: none; opacity: 0; }
      #cal .g u b { position: absolute; left: 50%; top: 0; width: 50px; height: 50px; margin-left: -25px; border-radius: 50%; background: var(--n); transform: scale(0); }
      #cal .g u em { position: relative; font-style: normal; }
      #cur { position: absolute; left: 0; top: 0; width: 44px; height: 44px; z-index: 50; filter: drop-shadow(0 6px 10px rgba(0, 20, 60, 0.35)); }
      #wh { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.2" data-width="1920" data-height="1080">
      <div class="blob" id="b0" style="left:-200px;top:-260px;width:900px;height:800px;background:#dfe9ff"></div>
      <div class="blob" id="b1" style="left:1200px;top:480px;width:900px;height:800px;background:#fff3c4;opacity:.8"></div>
      <div id="world">
        <div id="rings"></div>
        <svg id="logo" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="tagline">החופשה המושלמת שלכם מתחילה כאן.</div>
        <div id="h"><span>איתכם</span><span>בכל</span><span>חופשה</span><span>שתבחרו</span></div>

        <div class="c fld" id="f1" style="left:1300px;top:470px;width:420px"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.200-7-11.500A7 7 0 0 1 19 9.500C19 14.800 12 21 12 21z" /><circle cx="12" cy="9.500" r="2.500" /></svg><span id="f1t">הקלידו מלון או אזור</span></div>
        <div class="c fld" id="f2" style="left:880px;top:470px;width:400px"><svg viewBox="0 0 24 24"><rect x="3.500" y="5" width="17" height="15" rx="2" /><path d="M3.500 10h17M8 3v4M16 3v4" /></svg><span id="f2t">מתי מגיעים? - מתי עוזבים?</span></div>
        <div class="c fld" id="f3" style="left:440px;top:470px;width:420px;font-size:25px;gap:14px;padding:0 24px"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" /><path d="M4.500 20.500c1-4 4-6 7.500-6s6.500 2 7.500 6" /></svg><b>חדרים: 1 מבוגרים: 2 ילדים: ללא</b></div>
        <div class="c fld" id="btn" style="left:200px;top:470px;width:220px">חיפוש חופשה<div id="rip"></div></div>

        <div class="c" id="sug" style="left:1180px;top:596px;width:540px;height:132px"><img src="assets/img/berhero_0.jpg" /><div><div class="t">בראשית</div><div class="s">מצפה רמון והנגב</div></div><div class="x">Isrotel Exclusive</div></div>
        <div class="c" id="cal" style="left:860px;top:596px;width:440px;height:392px"><div class="m">דצמבר 2026</div><div class="g" id="calg"></div></div>
        <svg id="cur" viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.500L10 19z" fill="#fff" stroke="#0b1530" stroke-width="1.6" stroke-linejoin="round" /></svg>
      </div>
      <div id="wh"></div>
      <audio id="bed" src="assets/audio/bed.m4a" data-start="0" data-duration="6.2" data-track-index="10" data-volume="1"></audio>
    </div>
    <script>
      // Isrotel brand-flow promo — beat 1 and 2 for approval: the logo, then the site's real search bar taken apart into floating cards.
      const DUR = 6.2;
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), seg = (t, a, b) => clamp((t - a) / (b - a)), lerp = (a, b, k) => a + (b - a) * k;
      const outCubic = (x) => 1 - Math.pow(1 - x, 3), outExpo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)), inCubic = (x) => x * x * x, inOut = (x) => -(Math.cos(Math.PI * x) - 1) / 2;
      const outBack = (x) => (x <= 0 ? 0 : 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2));
      const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
      const T3 = (e, x, y, z, s = 1, rx = 0, ry = 0) => (e.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px," + z.toFixed(1) + "px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg) scale(" + Math.max(0.0001, s).toFixed(4) + ")");
      // December 2026 starts on a Tuesday
      { const g = $("#calg"); "אבגדהוש".split("").forEach((d) => (g.innerHTML += "<i>" + d + "׳</i>")); for (let i = 0; i < 2; i++) g.innerHTML += "<u></u>"; for (let d = 1; d <= 31; d++) g.innerHTML += '<u id="d' + d + '"><s></s><b></b><em>' + d + "</em></u>"; }
      // the logo: one path per letter, so the outline can draw before the fill arrives
      const LG = $("#logo"), NSV = "http://www.w3.org/2000/svg", B = LOGO.box; LG.setAttribute("viewBox", (B[0] - 6) + " " + (B[1] - 6) + " " + (B[2] + 12) + " " + (B[3] + 12));
      const letters = [...LOGO.top.map((d, i) => [d, 0, i]), ...LOGO.bot.map((d, i) => [d, 1, i])].map(([d, row, i]) => { const e = document.createElementNS(NSV, "path"); e.setAttribute("d", d); LG.appendChild(e); const L = e.getTotalLength(); e.style.strokeDasharray = L; return { e, L, row, i }; });
      const rings = []; for (let i = 0; i < 7; i++) { const r = document.createElement("i"), w = 520 + i * 70, h = 150 + i * 46; r.style.cssText = "width:" + w + "px;height:" + h + "px;left:" + -w / 2 + "px;top:" + -h / 2 + "px"; $("#rings").appendChild(r); rings.push(r); }
      // cursor path: [time, x, y]
      const CP = [[2.1, 1560, 940], [2.47, 1500, 524], [3.3, 1500, 530], [3.75, 1070, 524], [4.2, 1236, 896], [4.55, 1236, 896], [4.8, 1127, 896], [5.1, 1127, 896], [5.55, 306, 524], [6.2, 306, 524]];
      const CLICK = [2.5, 3.8, 4.28, 4.88, 5.62];
      const curAt = (t) => { let i = 0; while (i < CP.length - 2 && t > CP[i + 1][0]) i++; const a = CP[i], b = CP[i + 1], k = inOut(seg(t, a[0], b[0])); return [lerp(a[1], b[1], k), lerp(a[2], b[2], k) - Math.sin(k * Math.PI) * 26]; };

      function draw(t) {
        t = clamp(t, 0, DUR);
        [0, 1].forEach((i) => ($("#b" + i).style.transform = "translate(" + (Math.sin(t * 0.5 + i * 2) * 70).toFixed(1) + "px," + (Math.cos(t * 0.4 + i) * 50).toFixed(1) + "px)"));
        // camera: a slow drift, then a push into the search button
        const push = inCubic(seg(t, 5.62, 6.15));
        // camera keys: [time, focus x, focus y, zoom]; it eases from each key to the next
        const KEYS = [[0, 960, 540, 0.97], [2.4, 960, 540, 1.0], [2.95, 1440, 600, 1.5], [3.6, 1440, 612, 1.58], [4.1, 1085, 735, 1.42], [5.15, 1085, 748, 1.5], [5.58, 960, 540, 1.03], [9, 960, 540, 1.03]];
        let ki = 0; while (ki < KEYS.length - 2 && t > KEYS[ki + 1][0]) ki++; const ka = KEYS[ki], kb = KEYS[ki + 1], kk = inOut(seg(t, ka[0], kb[0]));
        const fx = lerp(lerp(ka[1], kb[1], kk), 310, push), fy = lerp(lerp(ka[2], kb[2], kk), 522, push), zm = lerp(ka[3], kb[3], kk) + push * 5, tilt = (1 - push) / (1 + (zm - 1) * 1.6), k = inOut(seg(t, 1.5, 5.6));
        $("#world").style.transformOrigin = "50% 50%";
        T3($("#world"), (960 - fx) * zm, (540 - fy) * zm, 0, zm, lerp(9, 3, k) * tilt, lerp(-7, 5, k) * tilt);
        $("#wh").style.opacity = seg(t, 5.9, 6.15);
        // 1. logo: contour rings spin in and tighten, the outline draws letter by letter, the fill lands, then it flies to the corner
        const out = inOut(seg(t, 1.5, 2.05)), settle = outBack(seg(t, 0.95, 1.35));
        rings.forEach((r, i) => { const q = seg(t, 0.0 + i * 0.03, 1.0 + i * 0.03), e = outCubic(q); r.style.opacity = (seg(t, 0, 0.12) * (1 - seg(q, 0.62, 1)) * (0.9 - i * 0.09)).toFixed(3);
          r.style.transform = "rotateX(" + (lerp(78, 0, e) + i * 3).toFixed(1) + "deg) rotateY(" + (lerp(-60 + i * 22, 0, e)).toFixed(1) + "deg) rotateZ(" + (lerp(i * 40, 0, e) + t * 30).toFixed(1) + "deg) scale(" + lerp(1.5 - i * 0.05, 0.55, e).toFixed(3) + ")"; });
        letters.forEach((l) => { const a = l.row ? 1.0 + l.i * 0.05 : 0.28 + l.i * 0.075, d = seg(t, a, a + (l.row ? 0.3 : 0.55)), f = seg(t, a + (l.row ? 0.12 : 0.4), a + (l.row ? 0.34 : 0.7));
          l.e.style.strokeDashoffset = (l.L * (1 - inOut(d))).toFixed(1); l.e.style.fillOpacity = f.toFixed(3); l.e.style.opacity = d > 0 ? 1 : 0;
          l.e.style.transform = "translateY(" + ((1 - outCubic(seg(t, a, a + 0.4))) * (l.row ? 14 : -10)).toFixed(1) + "px)"; });
        LG.style.transform = "translate3d(" + lerp(0, 736, out).toFixed(1) + "px," + lerp(0, -432, out).toFixed(1) + "px," + (70 * (1 - out)).toFixed(1) + "px) scale(" + ((0.94 + 0.06 * settle) * lerp(1, 0.3, out)).toFixed(4) + ")";
        const tg = $("#tagline"); tg.style.opacity = seg(t, 1.05, 1.35) * (1 - seg(t, 1.45, 1.62)); tg.style.transform = "translateY(" + ((1 - outCubic(seg(t, 1.05, 1.4))) * 24 + 40).toFixed(1) + "px)";
        // 2. headline and the search bar, card by card
        $$("#h span").forEach((s, i) => { const q = outExpo(seg(t, 1.9 + i * 0.09, 2.4 + i * 0.09)); s.style.opacity = q; s.style.filter = "blur(" + ((1 - q) * 14).toFixed(1) + "px)"; s.style.transform = "translateY(" + ((1 - q) * 40).toFixed(1) + "px)"; });
        [["#f1", 1.8, 70], ["#f2", 1.92, 40], ["#f3", 2.04, 20], ["#btn", 2.16, 90]].forEach(([id, a, z], i) => { const q = outBack(seg(t, a, a + 0.5)), e = $(id); e.style.opacity = seg(t, a, a + 0.12);
          const press = id === "#btn" ? seg(t, 5.6, 5.66) * (1 - seg(t, 5.66, 5.85)) : 0, act = (id === "#f1" ? seg(t, 2.45, 2.6) * (1 - seg(t, 3.5, 3.7)) : id === "#f2" ? seg(t, 3.75, 3.9) * (1 - seg(t, 5.2, 5.4)) : 0);
          T3(e, 0, (1 - q) * 160 + Math.sin(t * 1.3 + i) * 4, z * q + act * 40, (0.8 + 0.2 * q) * (1 - 0.05 * press) * (1 + 0.03 * act), (1 - q) * 30, 0);
          e.style.boxShadow = act > 0 ? "0 44px 110px rgba(0,45,116," + (0.16 + 0.14 * act).toFixed(3) + "), inset 0 0 0 " + (3 * act).toFixed(1) + "px #002d74" : ""; });
        const rp = seg(t, 5.62, 6.0); $("#rip").style.transform = "scale(" + (rp * 16).toFixed(2) + ")"; $("#rip").style.opacity = rp > 0 ? 1 - rp : 0;
        // typing the destination, and the suggestion that answers it
        const typed = "בראשית".slice(0, Math.floor(seg(t, 2.62, 3.15) * 6 + 0.001)); $("#f1t").innerHTML = typed ? "<b>" + typed + "</b>" + (t < 3.5 && Math.floor(t * 5) % 2 ? "|" : "") : "הקלידו מלון או אזור";
        const sq = outBack(seg(t, 3.0, 3.4)), so = seg(t, 3.6, 3.8); $("#sug").style.opacity = sq > 0 ? 1 - so : 0; T3($("#sug"), 0, (1 - sq) * -40 + so * 20, 110, 0.85 + 0.15 * sq, (1 - sq) * -40, 0);
        // the calendar: two clicks pick the dates
        const cq = outBack(seg(t, 3.85, 4.3)), co = seg(t, 5.15, 5.35); $("#cal").style.opacity = cq > 0 ? 1 - co : 0; T3($("#cal"), 0, (1 - cq) * -50 + co * 30, 130, 0.85 + 0.15 * cq, (1 - cq) * -45, 0);
        const p1 = outBack(seg(t, 4.28, 4.5)), p2 = outBack(seg(t, 4.88, 5.1));
        [[20, p1], [22, p2]].forEach(([d, p]) => { const u = $("#d" + d); u.querySelector("b").style.transform = "scale(" + p.toFixed(3) + ")"; u.querySelector("em").style.color = p > 0.5 ? "#fff" : ""; });
        [20, 21, 22].forEach((d) => { const s = $("#d" + d + " s"); s.style.opacity = seg(t, 4.9, 5.05); s.style.borderRadius = d === 20 ? "0 25px 25px 0" : d === 22 ? "25px 0 0 25px" : "0"; });
        $("#f2t").innerHTML = t > 4.95 ? "<b>20/12/26 - 22/12/26</b>" : t > 4.35 ? "<b>20/12/26</b> - מתי עוזבים?" : "מתי מגיעים? - מתי עוזבים?";
        // cursor
        const [cx, cy] = curAt(t), pr = Math.max(...CLICK.map((c) => seg(t, c - 0.06, c) * (1 - seg(t, c, c + 0.16)))), cur = $("#cur");
        cur.style.opacity = seg(t, 2.1, 2.3) * (1 - seg(t, 5.9, 6.05)); cur.style.transform = "translate3d(" + cx.toFixed(1) + "px," + cy.toFixed(1) + "px,170px) scale(" + (1 - 0.22 * pr).toFixed(3) + ")";
      }
      const tl = gsap.timeline({ paused: true }), pr = { t: 0 };
      tl.to(pr, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(pr.t) }, 0);
      draw(0);
      window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl; window.__draw = draw;
    </script>
