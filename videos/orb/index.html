        camera.lookAt(0, 0, 0);
        u.uFocus.value = camera.position.length() - 0.2;
        bloom.strength = 0.32 + 0.22 * band("lvl", t);
        drawMeter(t); meter.material.opacity = outCubic(seg(t, 0.2, 0.8));
        lens.uniforms.time.value = Math.floor(t * 60);
        composer.render();
      }
      resolveBuilt();
      renderAt(window.__hfThreeTime || 0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      window.__renderAt = renderAt;
    </script>
